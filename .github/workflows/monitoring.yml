# ══════════════════════════════════════════════════════════════════════════════
# 🏥 Monitoring Workflow — Health Checks, Retry, Analytics
# ══════════════════════════════════════════════════════════════════════════════
#
# Schedule (UTC):
#   - Health Check : Every day at 08:00 UTC
#   - Retry Failed : Every 6 hours (00:00, 06:00, 12:00, 18:00)
#   - Analytics    : Every Sunday at 09:00 UTC (weekly report)
#
# Manual triggers allow running individual tasks with custom parameters.
#
# Updates (2026):
#   ✅ Modern Python deps (no HF_TOKEN needed)
#   ✅ Multi-language token checks
#   ✅ WhatsApp notifications
#   ✅ Detailed reports
#
# ══════════════════════════════════════════════════════════════════════════════

name: 🏥 Daily Monitoring (Health + Retry + Analytics)

on:
  schedule:
    # ── Daily Health Check (08:00 UTC) ─────────────────────────────────────
    - cron: "0 8 * * *"

    # ── Retry Failed Publishes (every 6 hours) ────────────────────────────
    - cron: "0 0,6,12,18 * * *"

    # ── Weekly Analytics Report (Sunday 09:00 UTC) ────────────────────────
    - cron: "0 9 * * 0"

  workflow_dispatch:
    inputs:
      task:
        description: "اختر المهمة"
        required:    true
        default:     "all"
        type:        choice
        options:
          - "all"
          - "health_check"
          - "retry_publish"
          - "analytics"

      # ── Health Check Options ─────────────────────────────────────────────
      health_check_target:
        description: "🏥 ما الذي تريد فحصه"
        required:    false
        default:     "all"
        type:        choice
        options:
          - "all"
          - "database"
          - "api_keys"
          - "tokens"
          - "storage"
          - "publishing"
          - "disk"

      # ── Retry Publish Options ────────────────────────────────────────────
      retry_lang:
        description: "🔄 Retry: اللغة"
        required:    false
        default:     "all"
        type:        choice
        options:     ["all", "ar", "fr", "en"]

      retry_mode:
        description: "🔄 Retry: نوع المحتوى"
        required:    false
        default:     "all"
        type:        choice
        options:     ["all", "short", "long"]

      retry_platform:
        description: "🔄 Retry: المنصة"
        required:    false
        default:     "all"
        type:        choice
        options:     ["all", "facebook", "youtube"]

      retry_dry_run:
        description: "🔄 Retry: Dry run؟"
        required:    false
        default:     "false"
        type:        choice
        options:     ["false", "true"]

      # ── Analytics Options ────────────────────────────────────────────────
      analytics_period:
        description: "📊 Analytics: الفترة"
        required:    false
        default:     "week"
        type:        choice
        options:     ["day", "week", "month", "all"]

      analytics_lang:
        description: "📊 Analytics: اللغة"
        required:    false
        default:     "all"
        type:        choice
        options:     ["all", "ar", "fr", "en"]

concurrency:
  group:              monitoring
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # 🏥 HEALTH CHECK (Daily at 08:00 UTC)
  # ═══════════════════════════════════════════════════════════════════════

  health_check:
    name:    🏥 Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event.schedule == '0 8 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.task == 'health_check' ||
         github.event.inputs.task == 'all'))

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache:          'pip'

      - name: 📦 Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install requests openpyxl

      - name: 📥 Restore DB (AR)
        uses: dawidd6/action-download-artifact@v6
        with:
          name:                 vsg-database-ar
          if_no_artifact_found: ignore
          search_artifacts:     true

      - name: 🏥 Run Health Check
        env:
          # ── API Keys ──────────────────────────────────────────────────────
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}

          # ── YouTube (all languages) ──────────────────────────────────────
          YOUTUBE_CLIENT_ID_AR:     ${{ secrets.YOUTUBE_CLIENT_ID_AR }}
          YOUTUBE_CLIENT_SECRET_AR: ${{ secrets.YOUTUBE_CLIENT_SECRET_AR }}
          YOUTUBE_REFRESH_TOKEN_AR: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AR }}

          YOUTUBE_CLIENT_ID_FR:     ${{ secrets.YOUTUBE_CLIENT_ID_FR }}
          YOUTUBE_CLIENT_SECRET_FR: ${{ secrets.YOUTUBE_CLIENT_SECRET_FR }}
          YOUTUBE_REFRESH_TOKEN_FR: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FR }}

          YOUTUBE_CLIENT_ID_EN:     ${{ secrets.YOUTUBE_CLIENT_ID_EN }}
          YOUTUBE_CLIENT_SECRET_EN: ${{ secrets.YOUTUBE_CLIENT_SECRET_EN }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}

          # ── Facebook (Arabic as default for check) ───────────────────────
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID_AR }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN_AR }}
          CURRENT_LANG:      "ar"

          # ── WhatsApp Notifications ───────────────────────────────────────
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}

          # ── Telegram (Optional) ──────────────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          TARGET="${{ github.event.inputs.health_check_target || 'all' }}"

          echo "════════════════════════════════════════════════════════"
          echo "  🏥 Health Check"
          echo "════════════════════════════════════════════════════════"
          echo "  Target : $TARGET"
          echo "════════════════════════════════════════════════════════"

          python health_check.py \
            --check "$TARGET" \
            --notify \
            --no-fail


  # ═══════════════════════════════════════════════════════════════════════
  # 🔄 RETRY PUBLISH (Every 6 hours)
  # ═══════════════════════════════════════════════════════════════════════

  retry_publish:
    name:    🔄 Retry (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: |
      contains(github.event.schedule, '0 0,6,12,18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.task == 'retry_publish' ||
         github.event.inputs.task == 'all'))

    strategy:
      fail-fast: false
      matrix:
        lang: [ar, fr, en]

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache:          'pip'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg

      - name: 📦 Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install requests openpyxl

      - name: 📥 Restore DB (${{ matrix.lang }})
        uses: dawidd6/action-download-artifact@v6
        with:
          name:                 vsg-database-${{ matrix.lang }}
          if_no_artifact_found: ignore
          search_artifacts:     true

      - name: 🔄 Retry Publishes (${{ matrix.lang }})
        env:
          # ── Facebook (per language) ──────────────────────────────────────
          FB_PAGE_ID: ${{
            matrix.lang == 'ar' && secrets.FB_PAGE_ID_AR ||
            matrix.lang == 'fr' && secrets.FB_PAGE_ID_FR ||
            secrets.FB_PAGE_ID_EN
          }}
          FB_PAGE_TOKEN: ${{
            matrix.lang == 'ar' && secrets.FB_PAGE_TOKEN_AR ||
            matrix.lang == 'fr' && secrets.FB_PAGE_TOKEN_FR ||
            secrets.FB_PAGE_TOKEN_EN
          }}

          # ── YouTube (per language) ───────────────────────────────────────
          YOUTUBE_CLIENT_ID: ${{
            matrix.lang == 'ar' && secrets.YOUTUBE_CLIENT_ID_AR ||
            matrix.lang == 'fr' && secrets.YOUTUBE_CLIENT_ID_FR ||
            secrets.YOUTUBE_CLIENT_ID_EN
          }}
          YOUTUBE_CLIENT_SECRET: ${{
            matrix.lang == 'ar' && secrets.YOUTUBE_CLIENT_SECRET_AR ||
            matrix.lang == 'fr' && secrets.YOUTUBE_CLIENT_SECRET_FR ||
            secrets.YOUTUBE_CLIENT_SECRET_EN
          }}
          YOUTUBE_REFRESH_TOKEN: ${{
            matrix.lang == 'ar' && secrets.YOUTUBE_REFRESH_TOKEN_AR ||
            matrix.lang == 'fr' && secrets.YOUTUBE_REFRESH_TOKEN_FR ||
            secrets.YOUTUBE_REFRESH_TOKEN_EN
          }}

          # ── WhatsApp Notifications ───────────────────────────────────────
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}

          # ── Telegram (Optional) ──────────────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── Context ──────────────────────────────────────────────────────
          CURRENT_LANG: ${{ matrix.lang }}

        run: |
          # ── Read inputs ───────────────────────────────────────────────────
          LANG_INPUT="${{ github.event.inputs.retry_lang || 'all' }}"
          MODE_INPUT="${{ github.event.inputs.retry_mode || 'all' }}"
          PLATFORM_INPUT="${{ github.event.inputs.retry_platform || 'all' }}"
          DRY_RUN_INPUT="${{ github.event.inputs.retry_dry_run || 'false' }}"

          # ── Skip if specific language requested ───────────────────────────
          if [ "$LANG_INPUT" != "all" ] && \
             [ "$LANG_INPUT" != "${{ matrix.lang }}" ]; then
            echo "⏭️  Skipping ${{ matrix.lang }} (not selected)"
            exit 0
          fi

          # ── Build flags ───────────────────────────────────────────────────
          FLAGS="--lang ${{ matrix.lang }}"

          [ "$MODE_INPUT" != "all" ] && \
            FLAGS="$FLAGS --content-mode $MODE_INPUT"

          [ "$PLATFORM_INPUT" != "all" ] && \
            FLAGS="$FLAGS --platform $PLATFORM_INPUT"

          [ "$DRY_RUN_INPUT" = "true" ] && \
            FLAGS="$FLAGS --dry-run"

          # ── Print configuration ──────────────────────────────────────────
          echo "════════════════════════════════════════════════════════"
          echo "  🔄 Retry Publishes — ${{ matrix.lang }}"
          echo "════════════════════════════════════════════════════════"
          echo "  Mode     : $MODE_INPUT"
          echo "  Platform : $PLATFORM_INPUT"
          echo "  Dry Run  : $DRY_RUN_INPUT"
          echo "  Flags    : $FLAGS"
          echo "════════════════════════════════════════════════════════"

          python retry_publish.py $FLAGS

      - name: 💾 Save Database (${{ matrix.lang }})
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name:           vsg-database-${{ matrix.lang }}
          path:           vsg.db
          retention-days: 90
          overwrite:      true


  # ═══════════════════════════════════════════════════════════════════════
  # 📊 ANALYTICS REPORT (Sunday 09:00 UTC)
  # ═══════════════════════════════════════════════════════════════════════

  analytics:
    name:    📊 Analytics Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event.schedule == '0 9 * * 0' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.task == 'analytics' ||
         github.event.inputs.task == 'all'))

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache:          'pip'

      - name: 📦 Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: 📥 Restore DB (AR)
        uses: dawidd6/action-download-artifact@v6
        with:
          name:                 vsg-database-ar
          if_no_artifact_found: ignore
          search_artifacts:     true

      - name: 📊 Run Analytics
        env:
          # ── WhatsApp Notifications ───────────────────────────────────────
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}

          # ── Telegram (Optional) ──────────────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          PERIOD="${{ github.event.inputs.analytics_period || 'week' }}"
          LANG="${{ github.event.inputs.analytics_lang || 'all' }}"

          echo "════════════════════════════════════════════════════════"
          echo "  📊 Analytics Report"
          echo "════════════════════════════════════════════════════════"
          echo "  Period   : $PERIOD"
          echo "  Language : $LANG"
          echo "════════════════════════════════════════════════════════"

          # Create reports directory
          mkdir -p reports

          # Generate console report + send WhatsApp
          python analytics.py \
            --period "$PERIOD" \
            --lang "$LANG" \
            --format console \
            --notify

          # Generate HTML report and save
          python analytics.py \
            --period "$PERIOD" \
            --lang "$LANG" \
            --format html \
            --save "reports/analytics_$(date +%Y%m%d).html"

          # Generate JSON report and save
          python analytics.py \
            --period "$PERIOD" \
            --lang "$LANG" \
            --format json \
            --save "reports/analytics_$(date +%Y%m%d).json"

      - name: 📤 Upload reports
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name:               analytics-reports-${{ github.run_number }}
          path:               reports/
          retention-days:     90
          if-no-files-found:  ignore


  # ═══════════════════════════════════════════════════════════════════════
  # 📱 SUMMARY NOTIFICATION (After all jobs)
  # ═══════════════════════════════════════════════════════════════════════

  notify_summary:
    name:    📱 Send Summary
    runs-on: ubuntu-latest
    needs:   [health_check, retry_publish, analytics]
    if:      always()
    timeout-minutes: 5

    steps:

      - name: 📱 Notify Completion
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}

        run: |
          # ── Get job results ───────────────────────────────────────────────
          HEALTH_STATUS="${{ needs.health_check.result }}"
          RETRY_STATUS="${{ needs.retry_publish.result }}"
          ANALYTICS_STATUS="${{ needs.analytics.result }}"

          # ── Build message ─────────────────────────────────────────────────
          MESSAGE="🤖 Monitoring Complete\n\n"

          # Health Check status
          if [ "$HEALTH_STATUS" != "skipped" ]; then
            if [ "$HEALTH_STATUS" = "success" ]; then
              MESSAGE="${MESSAGE}✅ Health Check: passed\n"
            else
              MESSAGE="${MESSAGE}⚠️ Health Check: $HEALTH_STATUS\n"
            fi
          fi

          # Retry Publish status
          if [ "$RETRY_STATUS" != "skipped" ]; then
            if [ "$RETRY_STATUS" = "success" ]; then
              MESSAGE="${MESSAGE}✅ Retry Publish: complete\n"
            else
              MESSAGE="${MESSAGE}⚠️ Retry Publish: $RETRY_STATUS\n"
            fi
          fi

          # Analytics status
          if [ "$ANALYTICS_STATUS" != "skipped" ]; then
            if [ "$ANALYTICS_STATUS" = "success" ]; then
              MESSAGE="${MESSAGE}✅ Analytics: sent\n"
            else
              MESSAGE="${MESSAGE}⚠️ Analytics: $ANALYTICS_STATUS\n"
            fi
          fi

          # ── Send via Green-API ────────────────────────────────────────────
          if [ -n "$GREEN_API_INSTANCE_ID" ] && \
             [ -n "$GREEN_API_TOKEN" ] && \
             [ -n "$WHATSAPP_PHONE_NUMBER" ]; then

            CHAT_ID="${WHATSAPP_PHONE_NUMBER}@c.us"

            echo "📱 Sending summary to WhatsApp..."

            curl -s -X POST \
              "https://api.green-api.com/waInstance${GREEN_API_INSTANCE_ID}/sendMessage/${GREEN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"chatId\": \"$CHAT_ID\",
                \"message\": \"$MESSAGE\"
              }" || echo "⚠️ Failed to send WhatsApp notification"

            echo "✅ Summary sent"
          else
            echo "⚠️ WhatsApp credentials missing, skipping notification"
          fi
