# ══════════════════════════════════════════════════════════════════════════════
# 🇺🇸 English Videos Generator (Short + Long)
# ══════════════════════════════════════════════════════════════════════════════
#
# Schedule (UTC):
#   - 5 short videos: 13:00, 15:00, 17:00, 19:30, 22:00
#   - 1 long video:   23:00
#
# Manual triggers via workflow_dispatch with custom parameters.
#
# Updates (2026):
#   ✅ stable-ts replaces WhisperX (no HF_TOKEN needed)
#   ✅ PyTorch 2.5.1 (modern CPU version)
#   ✅ NumPy 2.x compatible
#   ✅ Faster cache strategy
#   ✅ npm ci for reproducible builds
#
# ══════════════════════════════════════════════════════════════════════════════

name: 🇺🇸 English Videos (Short + Long)

on:
  schedule:
    # ── 5 Short videos ─────────────────────────────────────────────────────
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "0 22 * * *"

    # ── 1 Long video ──────────────────────────────────────────────────────
    - cron: "0 23 * * *"

  workflow_dispatch:
    inputs:
      content_mode:
        description: "نوع المحتوى"
        required:    true
        default:     "short"
        type:        choice
        options:     ["short", "long"]

      video_number:
        description: "🎬 Video number (empty = auto next)"
        required:    false
        default:     ""
        type:        string

      force:
        description: "⚡ Force re-render?"
        required:    true
        default:     "false"
        type:        choice
        options:     ["false", "true"]

      force_ai:
        description: "🤖 Force re-generate AI?"
        required:    true
        default:     "false"
        type:        choice
        options:     ["false", "true"]

      publish_fb:
        description: "📘 Publish to Facebook?"
        required:    true
        default:     "true"
        type:        choice
        options:     ["true", "false"]

      publish_yt:
        description: "📺 Publish to YouTube?"
        required:    true
        default:     "true"
        type:        choice
        options:     ["true", "false"]

concurrency:
  group:              video-en
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  TORCH_VERSION:  "2.5.1"

jobs:
  generate:
    name:    🇺🇸 Generate English Video
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      # ── Setup ──────────────────────────────────────────────────────────────

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          echo "💾 Before cleanup:"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

          echo ""
          echo "💾 After cleanup:"
          df -h /

      # ── Python ─────────────────────────────────────────────────────────────

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache:          'pip'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade
          sudo fc-cache -fv

      # ── Cache (stable-ts models) ───────────────────────────────────────────

      - name: 💾 Cache stable-ts models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key:          stable-ts-models-v2-${{ runner.os }}
          restore-keys: stable-ts-models-

      # ── PyTorch (CPU) ──────────────────────────────────────────────────────

      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            torch==${{ env.TORCH_VERSION }} \
            torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu

      # ── Python Dependencies ────────────────────────────────────────────────

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: ✅ Verify stable-ts installation
        run: |
          python -c "import stable_whisper; print('✅ stable-ts OK')"

      # ── Node.js ────────────────────────────────────────────────────────────

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: npm ci

      # ── Playwright ─────────────────────────────────────────────────────────

      - name: 🌐 Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps

      # ── Restore Database ──────────────────────────────────────────────────

      - name: 📥 Restore DB
        uses: dawidd6/action-download-artifact@v6
        with:
          name:                 vsg-database-en
          if_no_artifact_found: ignore
          search_artifacts:     true

      # ── Main Generation ────────────────────────────────────────────────────

      - name: 🇺🇸 Generate + Publish English
        env:
          # ── AI Services ───────────────────────────────────────────────────
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}

          # ── Stock Videos ──────────────────────────────────────────────────
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}

          # ── Facebook ──────────────────────────────────────────────────────
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID_EN }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN_EN }}

          # ── YouTube ───────────────────────────────────────────────────────
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID_EN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_EN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}

          # ── WhatsApp Notifications ───────────────────────────────────────
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}

          # ── Telegram (Optional Backup) ───────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── Context for health checks ────────────────────────────────────
          CURRENT_LANG:      "en"

        run: |
          # ── Determine content mode ────────────────────────────────────────
          MODE="short"

          # Auto-determine from schedule (23:00 = long)
          HOUR=$(date -u +"%H")
          if [ "$HOUR" = "23" ]; then
            MODE="long"
          fi

          # Manual override
          if [ -n "${{ github.event.inputs.content_mode }}" ]; then
            MODE="${{ github.event.inputs.content_mode }}"
          fi

          # ── Set input/output paths ────────────────────────────────────────
          if [ "$MODE" = "long" ]; then
            INPUT_FILE="scripts/videos_en_long.xlsx"
            OUTPUT_DIR="output_long"
          else
            INPUT_FILE="scripts/videos_en.xlsx"
            OUTPUT_DIR="output"
          fi

          # ── Build flags ───────────────────────────────────────────────────
          FLAGS="--lang en --content-mode $MODE --auto-next"

          # Force flags
          [ "${{ github.event.inputs.force }}" = "true" ] && \
            FLAGS="$FLAGS --force"
          [ "${{ github.event.inputs.force_ai }}" = "true" ] && \
            FLAGS="$FLAGS --force-ai"

          # Publishing flags
          [ "${{ github.event.inputs.publish_fb }}" = "true" ] && \
            FLAGS="$FLAGS --publish-fb"
          [ "${{ github.event.inputs.publish_yt }}" = "true" ] && \
            FLAGS="$FLAGS --publish-yt"

          # Disable all publishing
          if [ "${{ github.event.inputs.publish_fb }}" = "false" ] && \
             [ "${{ github.event.inputs.publish_yt }}" = "false" ]; then
            FLAGS="$FLAGS --no-publish"
          fi

          # Specific video number
          if [ -n "${{ github.event.inputs.video_number }}" ]; then
            FLAGS="$FLAGS --video-number ${{ github.event.inputs.video_number }}"
          fi

          # ── Print configuration ──────────────────────────────────────────
          echo "════════════════════════════════════════════════════════"
          echo "  🇺🇸 English Video Generation"
          echo "════════════════════════════════════════════════════════"
          echo "  Mode       : $MODE"
          echo "  Input      : $INPUT_FILE"
          echo "  Output     : $OUTPUT_DIR"
          echo "  Hour (UTC) : $HOUR"
          echo "  Flags      : $FLAGS"
          echo "════════════════════════════════════════════════════════"

          # ── Run ───────────────────────────────────────────────────────────
          python main.py "$INPUT_FILE" \
            --output-dir "$OUTPUT_DIR" \
            $FLAGS

      # ── Artifacts ──────────────────────────────────────────────────────────

      - name: 📤 Upload final videos
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name: en-videos-${{ github.run_number }}
          path: |
            output/**/*_final.mp4
            output_long/**/*_final.mp4
          retention-days:     7
          if-no-files-found:  ignore

      - name: 📤 Upload thumbnails
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name: en-thumbnails-${{ github.run_number }}
          path: |
            output/**/*_thumbnail.png
            output_long/**/*_thumbnail.png
          retention-days:     30
          if-no-files-found:  ignore

      - name: 📤 Upload subtitles
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name: en-subtitles-${{ github.run_number }}
          path: |
            output/**/*.srt
            output_long/**/*.srt
          retention-days:     30
          if-no-files-found:  ignore

      - name: 💾 Save Database
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name:           vsg-database-en
          path:           vsg.db
          retention-days: 90
          overwrite:      true
