name: 🎬 Test Generate — All Languages

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "اللغة"
        required: true
        default: "ar"
        type: choice
        options: ["ar", "fr", "en", "all"]
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long", "both"]
      platform:
        description: "المنصة"
        required: true
        default: "yt"
        type: choice
        options: ["yt", "fb", "both"]
      video_number:
        description: "رقم الفيديو (فارغ = auto-next)"
        required: false
        default: ""
        type: string
      force_ai:
        description: "تجديد AI cache؟"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: test-generate-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  TORCH_VERSION:  "2.5.1"

jobs:

  # ══════════════════════════════════════════════════════════════
  # SETUP
  # ══════════════════════════════════════════════════════════════

  setup:
    name: 🔧 Decide Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      langs: ${{ steps.decide.outputs.langs }}
      modes: ${{ steps.decide.outputs.modes }}

    steps:
      - name: 🎯 Decide languages and modes
        id: decide
        run: |
          LANG="${{ github.event.inputs.lang }}"
          MODE="${{ github.event.inputs.content_mode }}"

          if [ "$LANG" = "all" ]; then
            LANGS='["ar","fr","en"]'
          else
            LANGS="[\"$LANG\"]"
          fi

          if [ "$MODE" = "both" ]; then
            MODES='["short","long"]'
          else
            MODES="[\"$MODE\"]"
          fi

          echo "langs=$LANGS" >> $GITHUB_OUTPUT
          echo "modes=$MODES" >> $GITHUB_OUTPUT
          echo "✅ Langs: $LANGS"
          echo "✅ Modes: $MODES"

  # ══════════════════════════════════════════════════════════════
  # GENERATE
  # ══════════════════════════════════════════════════════════════

  generate:
    name: 🎬 ${{ matrix.lang }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
        mode: ${{ fromJson(needs.setup.outputs.modes) }}

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "💾 Disk after cleanup:"
          df -h /

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade \
            fonts-dejavu-core \
            libglib2.0-0 \
            libgbm1
          sudo fc-cache -fv
          echo "✅ ffmpeg: $(ffmpeg -version 2>&1 | head -1)"

      - name: 💾 Cache Whisper/HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: whisper-models-v2-${{ runner.os }}
          restore-keys: |
            whisper-models-v2-
            whisper-models-

      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            torch==${{ env.TORCH_VERSION }} \
            torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'✅ PyTorch: {torch.__version__}')"

      - name: 📦 Install Python requirements
        run: |
          pip install "setuptools<81.0.0" wheel
          pip install faster-whisper==1.1.0 --no-build-isolation
          pip install --upgrade setuptools
          pip install -r requirements.txt
          echo "✅ Requirements OK"

      - name: ✅ Verify key packages
        run: |
          python -c "
          import torch, faster_whisper, stable_whisper, librosa, numpy as np
          print(f'✅ PyTorch       : {torch.__version__}')
          print(f'✅ faster-whisper: {faster_whisper.__version__}')
          print(f'✅ stable-ts     : {stable_whisper.__version__}')
          print(f'✅ librosa       : {librosa.__version__}')
          print(f'✅ numpy         : {np.__version__}')
          "

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          echo "✅ Node deps OK"

      - name: 🌐 Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps
          echo "✅ Playwright OK"

      - name: 📥 Restore Database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-${{ matrix.lang }}-${{ matrix.mode }}
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🎬 Generate ${{ matrix.lang }} / ${{ matrix.mode }}
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1:     ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2:     ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3:     ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4:     ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY5:     ${{ secrets.GROQ_API_KEY5 }}
          GROQ_API_KEY_1:    ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY_3:    ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY_4:    ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY_5:    ${{ secrets.GROQ_API_KEY5 }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1:   ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2:   ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3:   ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4:   ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5:   ${{ secrets.GEMINI_API_KEY5 }}
          GEMINI_API_KEY_1:  ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY_3:  ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY_4:  ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY_5:  ${{ secrets.GEMINI_API_KEY5 }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_1:  ${{ secrets.PEXELS_API_KEY_1 }}
          PEXELS_API_KEY_2:  ${{ secrets.PEXELS_API_KEY_2 }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEY_1: ${{ secrets.PIXABAY_API_KEY_1 }}
          PIXABAY_API_KEY_2: ${{ secrets.PIXABAY_API_KEY_2 }}

        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          PLATFORM="${{ github.event.inputs.platform || 'yt' }}"
          FORCE_AI="${{ github.event.inputs.force_ai || 'false' }}"
          VIDEO_NUM="${{ github.event.inputs.video_number }}"
          INPUT_FILE="scripts/${LANG}_${MODE}.xlsx"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          mkdir -p "$OUTPUT_DIR"

          echo "════════════════════════════════"
          echo "🌐 Lang     : $LANG"
          echo "📋 Mode     : $MODE"
          echo "🖥️  Platform : $PLATFORM"
          echo "📁 Input    : $INPUT_FILE"
          echo "📂 Output   : $OUTPUT_DIR"
          echo "════════════════════════════════"

          echo "🔑 API Keys:"
          [ -n "$GROQ_API_KEY" ]    && echo "  ✅ GROQ"    || echo "  ❌ GROQ"
          [ -n "$GROQ_API_KEY1" ]   && echo "  ✅ GROQ1"   || echo "  ⚠️  GROQ1"
          [ -n "$GEMINI_API_KEY" ]  && echo "  ✅ GEMINI"  || echo "  ❌ GEMINI"
          [ -n "$PEXELS_API_KEY" ]  && echo "  ✅ PEXELS"  || echo "  ❌ PEXELS"
          [ -n "$PIXABAY_API_KEY" ] && echo "  ✅ PIXABAY" || echo "  ❌ PIXABAY"
          echo "════════════════════════════════"

          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ File not found: $INPUT_FILE"
            ls -la scripts/ 2>/dev/null || echo "scripts/ not found"
            exit 1
          fi

          echo "✅ Input: $(du -h "$INPUT_FILE" | cut -f1)"

          # ✅ ARGS array بدل eval
          ARGS=(
            "$INPUT_FILE"
            --lang "$LANG"
            --content-mode "$MODE"
            --output-dir "$OUTPUT_DIR"
            --platform "$PLATFORM"
            --no-publish
          )

          if [ -n "$VIDEO_NUM" ]; then
            ARGS+=(--video-number "$VIDEO_NUM")
            echo "🎯 Video: $VIDEO_NUM"
          else
            ARGS+=(--auto-next)
            echo "🎯 Auto-next"
          fi

          if [ "$FORCE_AI" = "true" ]; then
            ARGS+=(--force-ai)
            echo "🤖 Force AI: yes"
          fi

          echo "🚀 python main.py ${ARGS[*]}"
          echo "════════════════════════════════"

          python main.py "${ARGS[@]}"
          EXIT_CODE=$?

          echo "════════════════════════════════"
          [ $EXIT_CODE -eq 0 ] \
            && echo "✅ Generation succeeded!" \
            || echo "❌ Generation failed: $EXIT_CODE"
          echo "════════════════════════════════"

          exit $EXIT_CODE

      - name: 📊 Show results
        if: always()
        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          echo "════════════════════════════════"
          echo "📊 Results: $LANG / $MODE"
          echo "════════════════════════════════"

          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -type f \
              \( -name "*.mp4" -o -name "*.srt" \
                 -o -name "*.json" -o -name "*.wav" \
                 -o -name "*.aac" -o -name "*.png" \) \
              | sort | while read f; do
                echo "  $(du -h "$f" | cut -f1)  $(basename "$f")"
              done

            MP4=$(find "$OUTPUT_DIR" -name "*.mp4" | wc -l)
            SRT=$(find "$OUTPUT_DIR" -name "*.srt" | wc -l)
            AUD=$(find "$OUTPUT_DIR" \( -name "*.wav" -o -name "*.aac" \) | wc -l)
            PNG=$(find "$OUTPUT_DIR" -name "*.png" | wc -l)
            echo ""
            echo "  📹 MP4: $MP4 | 📝 SRT: $SRT | 🎵 Audio: $AUD | 🖼️ PNG: $PNG"
          else
            echo "⚠️ Output dir not found"
          fi

          echo "💾 Disk: $(df -h / | tail -1)"

      - name: 📤 Upload final video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            video-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_final.mp4
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_published.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 📤 Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            audio-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.wav
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.aac
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            srt-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            thumb-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_thumbnail.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload all output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            output-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database-${{ matrix.lang }}-${{ matrix.mode }}
          path: vsg.db
          retention-days: 90
          overwrite: true

  # ══════════════════════════════════════════════════════════════
  # SUMMARY
  # ══════════════════════════════════════════════════════════════

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: generate
    if: always()

    steps:
      - name: 📊 Final summary
        run: |
          echo "════════════════════════════════════════════════"
          echo "📊 Generation Complete"
          echo "════════════════════════════════════════════════"
          echo "  Lang     : ${{ github.event.inputs.lang }}"
          echo "  Mode     : ${{ github.event.inputs.content_mode }}"
          echo "  Platform : ${{ github.event.inputs.platform }}"
          echo "  Run      : #${{ github.run_number }}"
          echo ""
          echo "📥 Artifacts:"
          echo "  📹 video-{lang}-{mode}-${{ github.run_number }}"
          echo "  🎵 audio-{lang}-{mode}-${{ github.run_number }}"
          echo "  📝 srt-{lang}-{mode}-${{ github.run_number }}"
          echo "  🖼️  thumb-{lang}-{mode}-${{ github.run_number }}"
          echo "  📂 output-{lang}-{mode}-${{ github.run_number }}"
          echo "  💾 vsg-database-{lang}-{mode}"
          echo ""
          echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "════════════════════════════════════════════════"
