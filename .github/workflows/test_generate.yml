# .github/workflows/test_generate.yml
name: 🎬 Test Generate — All Languages

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "اللغة"
        required: true
        default: "ar"
        type: choice
        options: ["ar", "fr", "en", "all"]
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long", "both"]
      video_number:
        description: "رقم الفيديو (فارغ = أول فيديو)"
        required: false
        default: ""
        type: string
      force_ai:
        description: "تجديد AI cache؟"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: test-generate-${{ github.event.inputs.lang }}-${{ github.event.inputs.content_mode }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  TORCH_VERSION:  "2.5.1"

jobs:

  setup:
    name: 🔧 Decide Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      langs: ${{ steps.decide.outputs.langs }}
      modes: ${{ steps.decide.outputs.modes }}

    steps:
      - name: 🎯 Decide languages and modes
        id: decide
        run: |
          LANG="${{ github.event.inputs.lang }}"
          MODE="${{ github.event.inputs.content_mode }}"

          if [ "$LANG" = "all" ]; then
            LANGS='["ar","fr","en"]'
          else
            LANGS="[\"$LANG\"]"
          fi

          if [ "$MODE" = "both" ]; then
            MODES='["short","long"]'
          else
            MODES="[\"$MODE\"]"
          fi

          echo "langs=$LANGS" >> $GITHUB_OUTPUT
          echo "modes=$MODES" >> $GITHUB_OUTPUT
          echo "✅ Langs: $LANGS | Modes: $MODES"

  generate:
    name: 🎬 ${{ matrix.lang }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
        mode: ${{ fromJson(needs.setup.outputs.modes) }}

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg libsndfile1 xvfb \
            fonts-noto fonts-noto-core \
            fonts-hosny-amiri fonts-sil-scheherazade \
            fonts-dejavu-core libglib2.0-0 libgbm1
          sudo fc-cache -fv
          ffmpeg -version | head -1

      - name: 💾 Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: whisper-models-v2-${{ runner.os }}
          restore-keys: |
            whisper-models-v2-
            whisper-models-

      - name: 🔥 Install PyTorch (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            torch==${{ env.TORCH_VERSION }} \
            torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu

      - name: 📦 Install openai-whisper
        run: |
          pip install "setuptools<81.0.0" wheel
          pip install openai-whisper==20240930 --no-build-isolation
          pip install --upgrade setuptools

      - name: 📦 Install Python requirements
        run: pip install -r requirements.txt

      - name: ✅ Verify stable-ts
        run: python -c "import stable_whisper; print('✅ stable-ts OK')"

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: |
          if [ -f "package-lock.json" ]; then npm ci
          else npm install; fi

      - name: 🌐 Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: 📥 Restore Database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-${{ matrix.lang }}
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🎬 Generate ${{ matrix.lang }} / ${{ matrix.mode }}
        env:
          # ══════════════════════════════════════════════
          # 🧠 Groq AI — يدعم التسميتين معاً
          # ══════════════════════════════════════════════
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          # بدون شرطة سفلية (مطابق لـ GitHub)
          GROQ_API_KEY1:     ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2:     ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3:     ${{ secrets.GROQ_API_KEY3 }}
          # مع شرطة سفلية (للتوافق)
          GROQ_API_KEY_1:    ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY_3:    ${{ secrets.GROQ_API_KEY3 }}

          # ══════════════════════════════════════════════
          # 🎙️ Gemini TTS
          # ══════════════════════════════════════════════
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1:   ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2:   ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3:   ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY_1:  ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY_2:  ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY_3:  ${{ secrets.GEMINI_API_KEY3 }}

          # ══════════════════════════════════════════════
          # 📹 Video Sources
          # ══════════════════════════════════════════════
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_1:  ${{ secrets.PEXELS_API_KEY_1 }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEY_1: ${{ secrets.PIXABAY_API_KEY_1 }}

        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          FORCE_AI="${{ github.event.inputs.force_ai || 'false' }}"
          VIDEO_NUM="${{ github.event.inputs.video_number }}"

          INPUT_FILE="scripts/${LANG}_${MODE}.xlsx"
          OUTPUT_DIR="output/${LANG}_${MODE}"
          mkdir -p "$OUTPUT_DIR"

          echo "════════════════════════════════"
          echo "🌐 Lang   : $LANG"
          echo "📋 Mode   : $MODE"
          echo "📁 Input  : $INPUT_FILE"
          echo "📂 Output : $OUTPUT_DIR"
          echo "════════════════════════════════"

          echo "🔑 API Keys check:"
          [ -n "$GROQ_API_KEY" ]   && echo "  ✅ GROQ_API_KEY"     || echo "  ❌ GROQ_API_KEY"
          [ -n "$GROQ_API_KEY1" ]  && echo "  ✅ GROQ_API_KEY1"    || echo "  ⚠️  GROQ_API_KEY1"
          [ -n "$GROQ_API_KEY2" ]  && echo "  ✅ GROQ_API_KEY2"    || echo "  ⚠️  GROQ_API_KEY2"
          [ -n "$GEMINI_API_KEY" ] && echo "  ✅ GEMINI_API_KEY"   || echo "  ❌ GEMINI_API_KEY"
          [ -n "$GEMINI_API_KEY1" ] && echo "  ✅ GEMINI_API_KEY1" || echo "  ⚠️  GEMINI_API_KEY1"
          [ -n "$GEMINI_API_KEY2" ] && echo "  ✅ GEMINI_API_KEY2" || echo "  ⚠️  GEMINI_API_KEY2"
          [ -n "$GEMINI_API_KEY3" ] && echo "  ✅ GEMINI_API_KEY3" || echo "  ⚠️  GEMINI_API_KEY3"
          [ -n "$PEXELS_API_KEY" ] && echo "  ✅ PEXELS_API_KEY"   || echo "  ❌ PEXELS_API_KEY"
          [ -n "$PIXABAY_API_KEY" ] && echo "  ✅ PIXABAY_API_KEY" || echo "  ❌ PIXABAY_API_KEY"
          echo "════════════════════════════════"

          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ File not found: $INPUT_FILE"
            ls -la scripts/ 2>/dev/null
            exit 1
          fi

          echo "✅ Input file found: $(du -h $INPUT_FILE | cut -f1)"

          CMD="python main.py \"$INPUT_FILE\""
          CMD="$CMD --lang $LANG"
          CMD="$CMD --content-mode $MODE"
          CMD="$CMD --output-dir $OUTPUT_DIR"
          CMD="$CMD --platform yt"
          CMD="$CMD --no-publish"

          if [ -n "$VIDEO_NUM" ]; then
            CMD="$CMD --video-number $VIDEO_NUM"
            echo "🎯 Video number: $VIDEO_NUM"
          else
            CMD="$CMD --auto-next"
            echo "🎯 Auto-next: enabled"
          fi

          if [ "$FORCE_AI" = "true" ]; then
            CMD="$CMD --force-ai"
            echo "🤖 Force AI: enabled"
          fi

          echo "════════════════════════════════"
          echo "🚀 Command: $CMD"
          echo "════════════════════════════════"

          eval $CMD
          EXIT_CODE=$?

          echo "════════════════════════════════"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Generation succeeded!"
          else
            echo "❌ Generation failed with code: $EXIT_CODE"
          fi
          echo "════════════════════════════════"

          exit $EXIT_CODE

      - name: 📊 Show results
        if: always()
        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          echo "════════════════════════════════"
          echo "📊 Results: $LANG / $MODE"
          echo "════════════════════════════════"

          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -type f \
              \( -name "*.mp4" -o -name "*.srt" \
                 -o -name "*.wav" -o -name "*.aac" \
                 -o -name "*.png" \) \
              | sort | while read f; do
                SIZE=$(du -h "$f" | cut -f1)
                echo "  $SIZE  $(basename $f)"
              done

            MP4=$(find "$OUTPUT_DIR" -name "*.mp4" | wc -l)
            SRT=$(find "$OUTPUT_DIR" -name "*.srt" | wc -l)
            AUD=$(find "$OUTPUT_DIR" \( -name "*.wav" -o -name "*.aac" \) | wc -l)
            echo ""
            echo "  📹 MP4: $MP4 | 📝 SRT: $SRT | 🎵 Audio: $AUD"
          fi

          echo ""
          df -h / | tail -1

      - name: 📤 Upload final video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_final.mp4
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_published.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 📤 Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.wav
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.aac
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload all output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: output/${{ matrix.lang }}_${{ matrix.mode }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-db-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: vsg.db
          retention-days: 90
          overwrite: true

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: generate
    if: always()

    steps:
      - name: 📊 Final Summary
        run: |
          echo "════════════════════════════════════════"
          echo "📊 Test Generation Complete"
          echo "════════════════════════════════════════"
          echo "  Lang : ${{ github.event.inputs.lang }}"
          echo "  Mode : ${{ github.event.inputs.content_mode }}"
          echo "  Run  : #${{ github.run_number }}"
          echo ""
          echo "📥 Download:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "════════════════════════════════════════"
