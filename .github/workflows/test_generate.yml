name: 🎬 Test Generate — All Languages

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "اللغة"
        required: true
        default: "ar"
        type: choice
        options: ["ar", "fr", "en", "all"]
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long", "both"]
      platform:
        description: "المنصة"
        required: true
        default: "yt"
        type: choice
        options: ["yt", "fb", "both"]
      video_number:
        description: "رقم الفيديو (فارغ = auto-next)"
        required: false
        default: ""
        type: string
      force_ai:
        description: "تجديد AI cache؟"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: "generate-${{ github.ref_name }}-${{ github.event.inputs.lang }}-${{ github.event.inputs.content_mode }}"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  TORCH_VERSION:  "2.5.1"
  FW_VERSION:     "1.1.0"
  # ✅ v3.2 — توحيد إصدار Playwright
  PLAYWRIGHT_VERSION: "1.50.0"

jobs:

  # ════════════════════════════════════════════════
  # SETUP
  # ════════════════════════════════════════════════

  setup:
    name: 🔧 Decide Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      langs: ${{ steps.decide.outputs.langs }}
      modes: ${{ steps.decide.outputs.modes }}

    steps:
      - name: 🎯 Decide languages and modes
        id: decide
        run: |
          LANG="${{ github.event.inputs.lang }}"
          MODE="${{ github.event.inputs.content_mode }}"

          case "$LANG" in
            ar|fr|en|all) ;;
            *)
              echo "❌ Invalid lang: '$LANG'"
              exit 1
              ;;
          esac

          case "$MODE" in
            short|long|both) ;;
            *)
              echo "❌ Invalid mode: '$MODE'"
              exit 1
              ;;
          esac

          if [ "$LANG" = "all" ]; then
            LANGS='["ar","fr","en"]'
          else
            LANGS="[\"${LANG}\"]"
          fi

          if [ "$MODE" = "both" ]; then
            MODES='["short","long"]'
          else
            MODES="[\"${MODE}\"]"
          fi

          echo "langs=${LANGS}" >> $GITHUB_OUTPUT
          echo "modes=${MODES}" >> $GITHUB_OUTPUT
          echo "✅ Langs: ${LANGS}"
          echo "✅ Modes: ${MODES}"

  # ════════════════════════════════════════════════
  # GENERATE
  # ════════════════════════════════════════════════

  generate:
    name: 🎬 ${{ matrix.lang }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
        mode: ${{ fromJson(needs.setup.outputs.modes) }}

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          echo "💾 Before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "💾 After cleanup:"
          df -h /

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ✅ v3.2 — إضافة libgomp1 المطلوب لـ stable-ts
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            libgomp1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade \
            fonts-dejavu-core \
            libglib2.0-0 \
            libgbm1
          sudo fc-cache -fv
          echo "✅ ffmpeg: $(ffmpeg -version 2>&1 | head -1)"
          echo "✅ libgomp1: $(dpkg -l libgomp1 | grep -c '^ii') installed"

      - name: 💾 Cache Whisper/HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: "whisper-v3-${{ runner.os }}-torch${{ env.TORCH_VERSION }}-fw${{ env.FW_VERSION }}"
          restore-keys: |
            whisper-v3-${{ runner.os }}-torch${{ env.TORCH_VERSION }}-
            whisper-v3-${{ runner.os }}-

      # ✅ v3.2 — Cache Playwright browsers (Python + Node.js)
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            remotion/node_modules/playwright/.local-browsers
            remotion/node_modules/playwright-core/.local-browsers
          key: "playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}"
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip
          pip install "setuptools<81.0.0" wheel
          pip install \
            torch==${{ env.TORCH_VERSION }} \
            torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu
          python -c "
          import torch
          print(f'✅ PyTorch: {torch.__version__}')
          "

      - name: 📦 Install Python requirements
        run: |
          pip install \
            faster-whisper==${{ env.FW_VERSION }} \
            --no-build-isolation
          pip install -r requirements.txt
          echo "✅ Requirements OK"
          echo "📋 Key packages:"
          pip list | grep -E \
            "setuptools|faster-whisper|torch|stable-ts|playwright" \
            || true

      - name: ✅ Verify key packages
        run: |
          python -c "
          import torch
          import faster_whisper
          import stable_whisper
          import librosa
          import numpy as np
          import playwright
          print(f'✅ PyTorch       : {torch.__version__}')
          print(f'✅ faster-whisper: {faster_whisper.__version__}')
          print(f'✅ stable-ts     : {stable_whisper.__version__}')
          print(f'✅ librosa       : {librosa.__version__}')
          print(f'✅ numpy         : {np.__version__}')
          print(f'✅ playwright    : {playwright.__version__}')
          "

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          echo "✅ Node deps OK"
          echo "📋 Playwright version (Node):"
          npx playwright --version 2>/dev/null || echo "  (not found)"

      # ✅ v3.2 — تثبيت Chromium لكلا البيئتين
      - name: 🌐 Install Playwright Chromium (Python + Node.js)
        run: |
          echo "🐍 Installing for Python Playwright..."
          python -m playwright install chromium --with-deps
          echo "✅ Python Playwright: OK"

          echo ""
          echo "🟢 Installing for Node.js Playwright..."
          cd remotion
          npx playwright install chromium --with-deps
          cd ..
          echo "✅ Node.js Playwright: OK"

          echo ""
          echo "📂 Browser paths:"
          echo "  Python cache:"
          ls ~/.cache/ms-playwright/ 2>/dev/null \
            | head -5 \
            || echo "    (empty)"
          echo "  Node.js cache:"
          ls remotion/node_modules/playwright/ \
            2>/dev/null | head -5 \
            || echo "    (empty)"

      - name: 📥 Restore Database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: "vsg-database-${{ matrix.lang }}-${{ matrix.mode }}"
          if_no_artifact_found: ignore
          search_artifacts: true
          branch: ${{ github.ref_name }}

      - name: 📋 Restore job database
        run: |
          DB_NAME="vsg_${{ matrix.lang }}_${{ matrix.mode }}.db"

          if [ -f "$DB_NAME" ]; then
            cp "$DB_NAME" vsg.db
            echo "✅ Restored: $DB_NAME → vsg.db"
            echo "   Size: $(du -sh vsg.db | cut -f1)"
          elif [ -f "vsg.db" ]; then
            echo "✅ Found vsg.db directly"
            echo "   Size: $(du -sh vsg.db | cut -f1)"
          else
            echo "ℹ️ No existing DB — fresh start"
          fi

      - name: 🎬 Generate ${{ matrix.lang }} / ${{ matrix.mode }}
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4: ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY5: ${{ secrets.GROQ_API_KEY5 }}

          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}

          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_1: ${{ secrets.PEXELS_API_KEY_1 }}
          PEXELS_API_KEY_2: ${{ secrets.PEXELS_API_KEY_2 }}

          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEY_1: ${{ secrets.PIXABAY_API_KEY_1 }}
          PIXABAY_API_KEY_2: ${{ secrets.PIXABAY_API_KEY_2 }}

        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          PLATFORM="${{ github.event.inputs.platform || 'yt' }}"
          FORCE_AI="${{ github.event.inputs.force_ai || 'false' }}"
          VIDEO_NUM="${{ github.event.inputs.video_number }}"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          INPUT_FILE="scripts/${LANG}_${MODE}.xlsx"
          if [ ! -f "$INPUT_FILE" ]; then
            FALLBACK="scripts/${LANG}.xlsx"
            if [ -f "$FALLBACK" ]; then
              echo "⚠️ Using fallback: $FALLBACK"
              INPUT_FILE="$FALLBACK"
            else
              echo "❌ No input file for $LANG/$MODE"
              echo "Available scripts:"
              ls scripts/*.xlsx 2>/dev/null || echo "  (none)"
              exit 1
            fi
          fi

          mkdir -p "$OUTPUT_DIR"

          echo "════════════════════════════════"
          echo "🌐 Lang     : $LANG"
          echo "📋 Mode     : $MODE"
          echo "🖥️  Platform : $PLATFORM"
          echo "📁 Input    : $INPUT_FILE ($(du -h "$INPUT_FILE" | cut -f1))"
          echo "📂 Output   : $OUTPUT_DIR"
          echo "════════════════════════════════"
          echo "🔑 API Keys:"
          [ -n "$GROQ_API_KEY" ]    && echo "  ✅ GROQ"    || echo "  ❌ GROQ"
          [ -n "$GROQ_API_KEY1" ]   && echo "  ✅ GROQ1"   || echo "  ⚠️  GROQ1"
          [ -n "$GEMINI_API_KEY" ]  && echo "  ✅ GEMINI"  || echo "  ❌ GEMINI"
          [ -n "$PEXELS_API_KEY" ]  && echo "  ✅ PEXELS"  || echo "  ❌ PEXELS"
          [ -n "$PIXABAY_API_KEY" ] && echo "  ✅ PIXABAY" || echo "  ❌ PIXABAY"
          echo "════════════════════════════════"

          ARGS=(
            "$INPUT_FILE"
            --lang "$LANG"
            --content-mode "$MODE"
            --output-dir "$OUTPUT_DIR"
            --platform "$PLATFORM"
            --no-publish
          )

          if [ -n "$VIDEO_NUM" ]; then
            ARGS+=(--video-number "$VIDEO_NUM")
            echo "🎯 Video: $VIDEO_NUM"
          else
            ARGS+=(--auto-next)
            echo "🎯 Auto-next"
          fi

          if [ "$FORCE_AI" = "true" ]; then
            ARGS+=(--force-ai)
            echo "🤖 Force AI: yes"
          fi

          echo "🚀 python main.py ${ARGS[*]}"
          echo "════════════════════════════════"

          python main.py "${ARGS[@]}"
          EXIT_CODE=$?

          echo "════════════════════════════════"
          [ $EXIT_CODE -eq 0 ] \
            && echo "✅ Generation succeeded!" \
            || echo "❌ Generation failed: $EXIT_CODE"
          echo "════════════════════════════════"

          exit $EXIT_CODE

      - name: 📊 Show results
        if: always()
        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          echo "════════════════════════════════"
          echo "📊 Results: $LANG / $MODE"
          echo "════════════════════════════════"

          if [ -d "$OUTPUT_DIR" ]; then
            MP4=0
            SRT=0
            AUD=0
            PNG=0

            while IFS= read -r f; do
              SIZE=$(du -h "$f" 2>/dev/null | cut -f1)
              echo "  ${SIZE}  $(basename "$f")"
              case "$f" in
                *.mp4)       MP4=$((MP4 + 1)) ;;
                *.srt)       SRT=$((SRT + 1)) ;;
                *.wav|*.aac) AUD=$((AUD + 1)) ;;
                *.png)       PNG=$((PNG + 1)) ;;
              esac
            done < <(find "$OUTPUT_DIR" -type f \( \
              -name "*.mp4" -o \
              -name "*.srt" -o \
              -name "*.json" -o \
              -name "*.wav" -o \
              -name "*.aac" -o \
              -name "*.png" \
            \) | sort)

            echo ""
            echo "  📹 MP4   : $MP4"
            echo "  📝 SRT   : $SRT"
            echo "  🎵 Audio : $AUD"
            echo "  🖼️  PNG   : $PNG"
          else
            echo "⚠️ Output dir not found: $OUTPUT_DIR"
          fi

          echo ""
          echo "💾 Disk: $(df -h / | tail -1)"

      # ════════════════════════════════════════════
      # ARTIFACTS
      # ════════════════════════════════════════════

      - name: 📤 Upload final video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "video-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}"
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_final.mp4
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_published.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 📤 Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "audio-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}"
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.wav
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.aac
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "srt-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}"
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "thumb-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}"
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_thumbnail.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "meta-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}"
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.json
          retention-days: 3
          if-no-files-found: ignore

      - name: 📋 Prepare database for upload
        if: always()
        run: |
          DB_NAME="vsg_${{ matrix.lang }}_${{ matrix.mode }}.db"

          if [ -f "vsg.db" ]; then
            cp vsg.db "$DB_NAME"
            echo "✅ DB prepared: $DB_NAME"
            echo "   Size: $(du -sh "$DB_NAME" | cut -f1)"
          else
            echo "⚠️ vsg.db not found — nothing to save"
          fi

      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "vsg-database-${{ matrix.lang }}-${{ matrix.mode }}"
          path: "vsg_${{ matrix.lang }}_${{ matrix.mode }}.db"
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

  # ════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: generate
    if: always()

    steps:
      - name: 📊 Final summary
        run: |
          RESULT="${{ needs.generate.result }}"

          echo "════════════════════════════════════════════════"
          echo "📊 Generation Complete"
          echo "════════════════════════════════════════════════"
          echo "  Lang     : ${{ github.event.inputs.lang }}"
          echo "  Mode     : ${{ github.event.inputs.content_mode }}"
          echo "  Platform : ${{ github.event.inputs.platform }}"
          echo "  Run      : #${{ github.run_number }}"
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Result   : $RESULT"
          echo ""

          case "$RESULT" in
            success)   echo "  ✅ All matrix jobs succeeded" ;;
            failure)   echo "  ❌ Some matrix jobs failed" ;;
            cancelled) echo "  ⚠️ Jobs were cancelled" ;;
            skipped)   echo "  ⏭️ Jobs were skipped" ;;
            *)         echo "  ⚠️ Unknown result: $RESULT" ;;
          esac

          echo ""
          echo "📥 Artifacts (run #${{ github.run_number }}):"
          echo "  📹 video-{lang}-{mode}-${{ github.run_number }}"
          echo "  🎵 audio-{lang}-{mode}-${{ github.run_number }}"
          echo "  📝 srt-{lang}-{mode}-${{ github.run_number }}"
          echo "  🖼️  thumb-{lang}-{mode}-${{ github.run_number }}"
          echo "  📋 meta-{lang}-{mode}-${{ github.run_number }}"
          echo ""
          echo "💾 Databases (persistent):"
          echo "  vsg-database-{lang}-{mode}"
          echo ""
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "════════════════════════════════════════════════"

          if [ "$RESULT" = "failure" ]; then
            exit 1
          fi
