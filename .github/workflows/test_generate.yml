# .github/workflows/test_generate.yml
name: 🎬 Test Generate — All Languages

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "اللغة"
        required: true
        default: "ar"
        type: choice
        options: ["ar", "fr", "en", "all"]
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long", "both"]
      video_number:
        description: "رقم الفيديو (فارغ = أول فيديو)"
        required: false
        default: ""
        type: string
      force_ai:
        description: "تجديد AI cache؟"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: test-generate-${{ github.event.inputs.lang }}-${{ github.event.inputs.content_mode }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"
  TORCH_VERSION:  "2.5.1"

jobs:

  # ════════════════════════════════════════════════════════════════════
  # SETUP — مشترك بين كل اللغات
  # ════════════════════════════════════════════════════════════════════

  setup:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      langs:  ${{ steps.decide.outputs.langs }}
      modes:  ${{ steps.decide.outputs.modes }}

    steps:

      - name: 🎯 Decide languages and modes
        id: decide
        run: |
          LANG="${{ github.event.inputs.lang }}"
          MODE="${{ github.event.inputs.content_mode }}"

          # Languages
          if [ "$LANG" = "all" ]; then
            echo 'langs=["ar","fr","en"]' >> $GITHUB_OUTPUT
          else
            echo "langs=[\"$LANG\"]" >> $GITHUB_OUTPUT
          fi

          # Modes
          if [ "$MODE" = "both" ]; then
            echo 'modes=["short","long"]' >> $GITHUB_OUTPUT
          else
            echo "modes=[\"$MODE\"]" >> $GITHUB_OUTPUT
          fi

          echo "✅ Lang: $LANG | Mode: $MODE"

  # ════════════════════════════════════════════════════════════════════
  # GENERATE — job لكل لغة + mode
  # ════════════════════════════════════════════════════════════════════

  generate:
    name: 🎬 ${{ matrix.lang }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: setup

    strategy:
      fail-fast: false   # ✅ لو لغة فشلت، كمّل الباقي
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
        mode: ${{ fromJson(needs.setup.outputs.modes) }}

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Free disk space ─────────────────────────────────────────
      - name: 🧹 Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "💾 Disk after cleanup:"
          df -h /

      # ── 3. Python ──────────────────────────────────────────────────
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── 4. System deps ─────────────────────────────────────────────
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade \
            fonts-dejavu-core \
            libglib2.0-0 \
            libgbm1
          sudo fc-cache -fv
          echo "✅ System deps installed"
          ffmpeg -version | head -1

      # ── 5. Cache models ────────────────────────────────────────────
      - name: 💾 Cache Whisper/HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: whisper-models-v2-${{ runner.os }}
          restore-keys: |
            whisper-models-v2-
            whisper-models-

      # ── 6. PyTorch ─────────────────────────────────────────────────
      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            torch==${{ env.TORCH_VERSION }} \
            torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu
          echo "✅ PyTorch installed"
          python -c "import torch; print(f'PyTorch: {torch.__version__}')"

      # ── 7. openai-whisper ──────────────────────────────────────────
      - name: 📦 Install openai-whisper
        run: |
          pip install "setuptools<81.0.0" wheel
          pip install openai-whisper==20240930 --no-build-isolation
          pip install --upgrade setuptools
          echo "✅ openai-whisper installed"

      # ── 8. Python requirements ─────────────────────────────────────
      - name: 📦 Install Python requirements
        run: |
          pip install -r requirements.txt
          echo "✅ Requirements installed"

      # ── 9. Verify stable-ts ────────────────────────────────────────
      - name: ✅ Verify stable-ts
        run: |
          python -c "
          import stable_whisper
          print(f'✅ stable-ts: {stable_whisper.__version__}')
          "

      # ── 10. Node.js ────────────────────────────────────────────────
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # ── 11. Node deps ──────────────────────────────────────────────
      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --prefer-offline
          else
            npm install
          fi
          echo "✅ Node deps installed"

      # ── 12. Playwright ─────────────────────────────────────────────
      - name: 🌐 Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps
          echo "✅ Playwright installed"

      # ── 13. Restore DB ─────────────────────────────────────────────
      - name: 📥 Restore Database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-${{ matrix.lang }}
          if_no_artifact_found: ignore
          search_artifacts: true

      # ── 14. Generate Video ─────────────────────────────────────────
      - name: 🎬 Generate ${{ matrix.lang }} / ${{ matrix.mode }}
        env:
          # ── AI ──
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1:   ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2:   ${{ secrets.GROQ_API_KEY_2 }}

          # ── Video Sources ──
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_1: ${{ secrets.PEXELS_API_KEY_1 }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEY_1:${{ secrets.PIXABAY_API_KEY_1 }}

        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          FORCE_AI="${{ github.event.inputs.force_ai || 'false' }}"
          VIDEO_NUM="${{ github.event.inputs.video_number || '' }}"

          # ✅ تحديد ملف المحتوى
          INPUT_FILE="scripts/${LANG}_${MODE}.xlsx"

          # ✅ تحديد مجلد الـ output
          OUTPUT_DIR="output/${LANG}_${MODE}"
          mkdir -p "$OUTPUT_DIR"

          echo "════════════════════════════════════════"
          echo "🌐 Lang     : $LANG"
          echo "📋 Mode     : $MODE"
          echo "📁 Input    : $INPUT_FILE"
          echo "📂 Output   : $OUTPUT_DIR"
          echo "════════════════════════════════════════"

          # ✅ تحقق من وجود الملف
          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ File not found: $INPUT_FILE"
            exit 1
          fi

          # ✅ بناء الـ command
          FLAGS=(
            "$INPUT_FILE"
            --lang         "$LANG"
            --content-mode "$MODE"
            --output-dir   "$OUTPUT_DIR"
            --no-publish
            --auto-next
          )

          # رقم فيديو محدد؟
          if [ -n "$VIDEO_NUM" ]; then
            FLAGS+=(--video-number "$VIDEO_NUM")
            # أزل --auto-next إذا حددنا رقم
            FLAGS=("${FLAGS[@]/--auto-next/}")
          fi

          # Force AI؟
          [ "$FORCE_AI" = "true" ] && FLAGS+=(--force-ai)

          # Platform حسب mode
          if [ "$MODE" = "long" ]; then
            FLAGS+=(--platform yt)
          else
            FLAGS+=(--platform yt)
          fi

          echo "🚀 Running: python main.py ${FLAGS[*]}"
          echo "════════════════════════════════════════"

          python main.py "${FLAGS[@]}"

          echo "════════════════════════════════════════"
          echo "✅ Done: $LANG / $MODE"
          ls -lh "$OUTPUT_DIR"/ 2>/dev/null || echo "No files in output"
          echo "════════════════════════════════════════"

      # ── 15. Show results ───────────────────────────────────────────
      - name: 📊 Show generation results
        if: always()
        run: |
          LANG="${{ matrix.lang }}"
          MODE="${{ matrix.mode }}"
          OUTPUT_DIR="output/${LANG}_${MODE}"

          echo "════════════════════════════════════════"
          echo "📊 Results: $LANG / $MODE"
          echo "════════════════════════════════════════"

          if [ -d "$OUTPUT_DIR" ]; then
            echo "📁 Files generated:"
            find "$OUTPUT_DIR" -type f | while read f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "  $SIZE  $(basename $f)"
            done

            # إحصائيات
            MP4_COUNT=$(find "$OUTPUT_DIR" -name "*.mp4" | wc -l)
            SRT_COUNT=$(find "$OUTPUT_DIR" -name "*.srt" | wc -l)
            echo ""
            echo "  📹 MP4 files : $MP4_COUNT"
            echo "  📝 SRT files : $SRT_COUNT"
          else
            echo "⚠️ Output directory not found"
          fi

          echo ""
          echo "💾 Disk usage:"
          df -h / | tail -1

      # ── 16. Upload final video ─────────────────────────────────────
      - name: 📤 Upload final video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_final.mp4
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*_published.mp4
          retention-days: 7
          if-no-files-found: warn

      # ── 17. Upload subtitles ───────────────────────────────────────
      - name: 📤 Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srt-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/**/*.srt
          retention-days: 7
          if-no-files-found: ignore

      # ── 18. Upload logs ────────────────────────────────────────────
      - name: 📤 Upload all output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.lang }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            output/${{ matrix.lang }}_${{ matrix.mode }}/
          retention-days: 3
          if-no-files-found: ignore

      # ── 19. Save DB ────────────────────────────────────────────────
      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database-${{ matrix.lang }}
          path: vsg.db
          retention-days: 90
          overwrite: true

  # ════════════════════════════════════════════════════════════════════
  # SUMMARY — ملخص بعد كل اللغات
  # ════════════════════════════════════════════════════════════════════

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: generate
    if: always()

    steps:

      - name: 📊 Show summary
        run: |
          echo "════════════════════════════════════════════════"
          echo "📊 Test Generation Summary"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "  Lang   : ${{ github.event.inputs.lang }}"
          echo "  Mode   : ${{ github.event.inputs.content_mode }}"
          echo "  Run    : #${{ github.run_number }}"
          echo ""
          echo "  Artifacts available:"
          echo "  ✅ video-{lang}-{mode}-${{ github.run_number }}"
          echo "  ✅ srt-{lang}-{mode}-${{ github.run_number }}"
          echo "  ✅ output-{lang}-{mode}-${{ github.run_number }}"
          echo ""
          echo "  👉 Download from:"
          echo "  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "════════════════════════════════════════════════"
