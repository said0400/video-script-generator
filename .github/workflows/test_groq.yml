name: 🔍 Test Groq Models

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Groq
        run: pip install groq
      
      - name: Test models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python test_groq.py
