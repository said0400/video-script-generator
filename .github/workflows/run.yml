name: 🎬 Video Generator (KCS + WhisperX)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Excel file path'
        required: true
        default: 'scripts/videos.xlsx'
      video_number:
        description: 'Video number (empty = all)'
        required: false
        default: ''
      force:
        description: 'Force re-render (true/false)'
        required: false
        default: 'false'
      no_publish:
        description: 'Skip publishing (true/false)'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    
    # ═══════════════════════════════════════════════════════════════
    # 1. Checkout Code
    # ═══════════════════════════════════════════════════════════════
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    
    # ═══════════════════════════════════════════════════════════════
    # 2. Setup Python
    # ═══════════════════════════════════════════════════════════════
    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # ═══════════════════════════════════════════════════════════════
    # 3. Setup Node.js
    # ═══════════════════════════════════════════════════════════════
    - name: 🟢 Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    # ═══════════════════════════════════════════════════════════════
    # 4. Install System Dependencies (مع dependencies للـ WhisperX)
    # ═══════════════════════════════════════════════════════════════
    - name: 🔧 Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          ffmpeg \
          libsndfile1 \
          libasound2-dev \
          portaudio19-dev \
          fonts-noto-color-emoji \
          fonts-noto-cjk \
          fonts-noto-extra
        
        # Arabic fonts
        sudo apt-get install -y fonts-amiri fonts-kacst fonts-arabeyes
        
        echo "✅ System dependencies installed"
    
    # ═══════════════════════════════════════════════════════════════
    # 5. ✨ NEW: Install PyTorch CPU FIRST (مهم للـ WhisperX)
    # ═══════════════════════════════════════════════════════════════
    - name: 🔥 Install PyTorch (CPU only - faster install)
      run: |
        pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        echo "✅ PyTorch installed"
    
    # ═══════════════════════════════════════════════════════════════
    # 6. Install Python Dependencies
    # ═══════════════════════════════════════════════════════════════
    - name: 📦 Install Python dependencies
      run: |
        pip install -r requirements.txt
        echo "✅ Python dependencies installed"
    
    # ═══════════════════════════════════════════════════════════════
    # 7. Install Playwright Browsers
    # ═══════════════════════════════════════════════════════════════
    - name: 🌐 Install Playwright browsers
      run: |
        python -m playwright install chromium --with-deps
        echo "✅ Playwright installed"
    
    # ═══════════════════════════════════════════════════════════════
    # 8. ✨ NEW: Cache WhisperX Models (لتسريع التشغيلات اللاحقة)
    # ═══════════════════════════════════════════════════════════════
    - name: 💾 Cache WhisperX models
      id: cache-whisperx
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/whisperx
          ~/.cache/huggingface
          ~/.cache/torch
        key: whisperx-models-medium-v2
        restore-keys: |
          whisperx-models-
    
    - name: 📊 Cache status
      run: |
        if [ "${{ steps.cache-whisperx.outputs.cache-hit }}" == 'true' ]; then
          echo "✅ Using cached WhisperX models (faster!)"
        else
          echo "📥 Will download WhisperX models (~1.5 GB, first run only)"
        fi
    
    # ═══════════════════════════════════════════════════════════════
    # 9. Restore Database Cache
    # ═══════════════════════════════════════════════════════════════
    - name: 💾 Cache database
      uses: actions/cache@v4
      with:
        path: |
          vsg.db
          output/
        key: vsg-database-${{ github.run_id }}
        restore-keys: |
          vsg-database-
    
    # ═══════════════════════════════════════════════════════════════
    # 10. Run the Generator
    # ═══════════════════════════════════════════════════════════════
    - name: 🎬 Generate videos
      env:
        GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
        FB_PAGE_ID1:       ${{ secrets.FB_PAGE_ID1 }}
        FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN }}
      run: |
        ARGS="${{ github.event.inputs.input_file }}"
        
        if [ -n "${{ github.event.inputs.video_number }}" ]; then
          ARGS="$ARGS --video-number ${{ github.event.inputs.video_number }}"
        fi
        
        if [ "${{ github.event.inputs.force }}" == "true" ]; then
          ARGS="$ARGS --force"
        fi
        
        if [ "${{ github.event.inputs.no_publish }}" == "true" ]; then
          ARGS="$ARGS --no-publish"
        fi
        
        python main.py $ARGS
    
    # ═══════════════════════════════════════════════════════════════
    # 11. Upload Results
    # ═══════════════════════════════════════════════════════════════
    - name: 📤 Upload videos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: videos
        path: output/**/*.mp4
        retention-days: 7
    
    - name: 📤 Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          output/**/*.json
          output/**/*.txt
        retention-days: 7
