name: 🎬 Motivational Video Generator (KCS + WhisperX)

on:
  workflow_dispatch:
    inputs:

      scripts_file:
        description: "📄 Path to scripts file (e.g. scripts/videos.xlsx)"
        required: true
        default: "scripts/videos.xlsx"
        type: string

      video_number:
        description: "🎬 Video number to process (empty = all)"
        required: false
        default: ""
        type: string

      voice_en:
        description: "🎙️ English voice"
        required: true
        default: "male_smooth"
        type: choice
        options: [male_smooth, male_warm, female_clear, female_warm, neutral]

      voice_ar:
        description: "🎙️ Arabic voice"
        required: true
        default: "female_warm"
        type: choice
        options: [male_smooth, male_warm, female_clear, female_warm, neutral]

      sfx_type:
        description: "🔊 Transition SFX"
        required: true
        default: "swoosh"
        type: choice
        options: [swoosh, whoosh]

      music_volume:
        description: "🎵 Music volume (0.08=quiet | 0.12=medium | 0.18=loud)"
        required: true
        default: "0.12"
        type: string

      formats:
        description: "📐 Export formats (comma-separated: 1x1,16x9,4x5)"
        required: true
        default: "1x1,16x9"
        type: string

      script_only:
        description: "📝 Script only? (no audio/video)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      no_video:
        description: "🎵 Audio only? (skip video render)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      force:
        description: "⚡ Force re-render? (ignore resume)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      force_ai:
        description: "🤖 Force re-generate AI data?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      publish_fb:
        description: "📘 Auto-publish to Facebook after render?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      fb_language:
        description: "🌐 Facebook publish language"
        required: true
        default: "ar"
        type: choice
        options: [ar, en, both]

jobs:
  generate:
    name: 🎬 Generate + Publish
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ═══════════════════════════════════════════════════════════════
      # 1. Checkout
      # ═══════════════════════════════════════════════════════════════
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════
      # 2. Setup Python
      # ═══════════════════════════════════════════════════════════════
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # ═══════════════════════════════════════════════════════════════
      # 3. ✨ FIX: Install PyTorch with COMPATIBLE version
      # ═══════════════════════════════════════════════════════════════
      - name: 🔥 Install PyTorch (CPU - COMPATIBLE versions)
        run: |
          pip install --upgrade pip
          
          # ⚠️ مهم: استخدم torch 2.0.x المتوافق مع whisperx
          pip install torch==2.0.1+cpu torchaudio==2.0.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          
          # تأكد من الإصدارات
          python -c "import torch; print(f'✅ PyTorch: {torch.__version__}')"
          python -c "import torchaudio; print(f'✅ TorchAudio: {torchaudio.__version__}')"

      # ═══════════════════════════════════════════════════════════════
      # 4. Install Python Dependencies
      # ═══════════════════════════════════════════════════════════════
      - name: 📦 Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          
          # تحقق من WhisperX
          python -c "import whisperx; print(f'✅ WhisperX installed')"

      # ═══════════════════════════════════════════════════════════════
      # 5. Setup Node.js
      # ═══════════════════════════════════════════════════════════════
      - name: 🟢 Setup Node.js 20
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ═══════════════════════════════════════════════════════════════
      # 6. Install Node Dependencies
      # ═══════════════════════════════════════════════════════════════
      - name: 📦 Install Node dependencies
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npm install

      # ═══════════════════════════════════════════════════════════════
      # 7. Install System Dependencies
      # ═══════════════════════════════════════════════════════════════
      - name: 🔧 Install system dependencies
        if: ${{ inputs.script_only == 'false' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            libasound2-dev \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxshmfence1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade
          sudo fc-cache -fv
          ffmpeg -version | head -1
          echo "✅ System dependencies installed"

      # ═══════════════════════════════════════════════════════════════
      # 8. Install Playwright Chromium (Node)
      # ═══════════════════════════════════════════════════════════════
      - name: 🌐 Install Playwright Chromium (Node)
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npx playwright install chromium

      # ═══════════════════════════════════════════════════════════════
      # 9. Cache WhisperX Models (✨ غيّرنا الـ key إلى v3)
      # ═══════════════════════════════════════════════════════════════
      - name: 💾 Cache WhisperX models
        id: cache-whisperx
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisperx
            ~/.cache/huggingface
            ~/.cache/torch
          key: whisperx-models-medium-v3
          restore-keys: |
            whisperx-models-

      - name: 📊 WhisperX cache status
        run: |
          if [ "${{ steps.cache-whisperx.outputs.cache-hit }}" == 'true' ]; then
            echo "✅ Using cached WhisperX models (faster!)"
          else
            echo "📥 Will download WhisperX models on first run (~1.5 GB)"
          fi

      # ═══════════════════════════════════════════════════════════════
      # 10. Restore SQLite Database (Resume)
      # ═══════════════════════════════════════════════════════════════
      - name: 📥 Restore SQLite database (resume)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database
          if_no_artifact_found: ignore
          search_artifacts: true

      # ═══════════════════════════════════════════════════════════════
      # 11. Run Generator + Publish
      # ═══════════════════════════════════════════════════════════════
      - name: 🎬 Run generator + publish
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID1:      ${{ secrets.FB_PAGE_ID1 }}
          FB_PAGE_TOKEN:    ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          FLAGS=""

          [ "${{ inputs.script_only }}" = "true" ] && FLAGS="$FLAGS --script-only"
          [ "${{ inputs.no_video }}"    = "true" ] && FLAGS="$FLAGS --no-video"
          [ "${{ inputs.force }}"       = "true" ] && FLAGS="$FLAGS --force"
          [ "${{ inputs.force_ai }}"    = "true" ] && FLAGS="$FLAGS --force-ai"
          [ "${{ inputs.publish_fb }}"  = "true" ] && FLAGS="$FLAGS --publish-fb --fb-lang ${{ inputs.fb_language }}"

          [ -n "${{ inputs.video_number }}" ] && \
            FLAGS="$FLAGS --video-number ${{ inputs.video_number }}"

          python main.py "${{ inputs.scripts_file }}" \
            --voice-en     "${{ inputs.voice_en }}"    \
            --voice-ar     "${{ inputs.voice_ar }}"    \
            --music-volume "${{ inputs.music_volume }}" \
            --sfx-type     "${{ inputs.sfx_type }}"    \
            --formats      "${{ inputs.formats }}"     \
            --output-dir   output                      \
            $FLAGS

      # ═══════════════════════════════════════════════════════════════
      # 12. Upload Final Videos (9:16)
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Upload final videos (9:16)
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-9x16-${{ github.run_number }}
          path: output/**/*_final.mp4
          retention-days: 7

      # ═══════════════════════════════════════════════════════════════
      # 13. Upload Additional Formats
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Upload additional formats
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-formats-${{ github.run_number }}
          path: |
            output/**/*_1_1.mp4
            output/**/*_16_9.mp4
            output/**/*_4_5.mp4
          retention-days: 7

      # ═══════════════════════════════════════════════════════════════
      # 14. Upload SRT Subtitles
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Upload SRT subtitles
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitles-${{ github.run_number }}
          path: output/**/*.srt
          retention-days: 30

      # ═══════════════════════════════════════════════════════════════
      # 15. Upload Thumbnails
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Upload thumbnails
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ github.run_number }}
          path: output/**/*_thumbnail.png
          retention-days: 30

      # ═══════════════════════════════════════════════════════════════
      # 16. Upload Audio (audio-only mode)
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Upload audio
        if: ${{ inputs.no_video == 'true' && inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_number }}
          path: output/**/*_audio_mixed.aac
          retention-days: 7

      # ═══════════════════════════════════════════════════════════════
      # 17. Save SQLite Database (Resume)
      # ═══════════════════════════════════════════════════════════════
      - name: 📤 Save SQLite database (resume)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database
          path: vsg.db
          retention-days: 90
          overwrite: true
