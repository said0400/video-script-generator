name: 🎬 Video Generator (VAS + AI)

on:
  workflow_dispatch:
    inputs:
      scripts_file:
        description: "📄 Path to scripts file"
        required: true
        default: "scripts/videos.xlsx"
        type: string

      video_number:
        description: "🎬 Video number (empty = all)"
        required: false
        default: ""
        type: string

      voice_en:
        description: "🎙️ English voice"
        required: true
        default: "male_smooth"
        type: choice
        options: [male_smooth, male_warm, female_clear, female_warm, neutral]

      voice_ar:
        description: "🎙️ Arabic voice"
        required: true
        default: "female_warm"
        type: choice
        options: [male_smooth, male_warm, female_clear, female_warm, neutral]

      sfx_type:
        description: "🔊 Transition SFX"
        required: true
        default: "swoosh"
        type: choice
        options: [swoosh, whoosh]

      music_volume:
        description: "🎵 Music volume"
        required: true
        default: "0.12"
        type: string

      formats:
        description: "📐 Export formats"
        required: true
        default: "1x1,16x9"
        type: string

      script_only:
        description: "📝 Script only?"
        default: "false"
        type: choice
        options: ["false", "true"]

      force:
        description: "⚡ Force re-render?"
        default: "false"
        type: choice
        options: ["false", "true"]

      force_ai:
        description: "🤖 Force re-run AI?"
        default: "false"
        type: choice
        options: ["false", "true"]

      no_publish:
        description: "🚫 Disable Facebook publish?"
        default: "false"
        type: choice
        options: ["false", "true"]

      fb_language:
        description: "🌐 Facebook publish language"
        required: true
        default: "ar"
        type: choice
        options: [ar, en, both]

jobs:
  generate:
    name: 🎬 Generate Videos
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python deps
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: 🟢 Setup Node.js
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Node deps
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npm install

      - name: 🔧 Install system deps
        if: ${{ inputs.script_only == 'false' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 xvfb \
            fonts-noto fonts-noto-core fonts-hosny-amiri
          sudo fc-cache -fv

      - name: 🌐 Install Playwright Chromium
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npx playwright install chromium

      - name: 📥 Restore DB cache
        uses: actions/cache@v4
        with:
          path: vsg.db
          key: vsg-db-${{ github.ref_name }}
          restore-keys: |
            vsg-db-

      - name: 🎬 Run generator
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID1:      ${{ secrets.FB_PAGE_ID1 }}
          FB_PAGE_TOKEN:    ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          FLAGS=""
          [ "${{ inputs.script_only }}" = "true" ] && FLAGS="$FLAGS --script-only"
          [ "${{ inputs.force }}"       = "true" ] && FLAGS="$FLAGS --force"
          [ "${{ inputs.force_ai }}"    = "true" ] && FLAGS="$FLAGS --force-ai"
          [ "${{ inputs.no_publish }}"  = "true" ] && FLAGS="$FLAGS --no-publish"

          [ -n "${{ inputs.video_number }}" ] && \
            FLAGS="$FLAGS --video-number ${{ inputs.video_number }}"

          python main.py "${{ inputs.scripts_file }}" \
            --voice-en     "${{ inputs.voice_en }}"     \
            --voice-ar     "${{ inputs.voice_ar }}"     \
            --music-volume "${{ inputs.music_volume }}" \
            --sfx-type     "${{ inputs.sfx_type }}"     \
            --formats      "${{ inputs.formats }}"      \
            --fb-lang      "${{ inputs.fb_language }}"  \
            --output-dir   output                       \
            $FLAGS

      - name: 📤 Upload videos (9:16)
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-9x16-${{ github.run_number }}
          path: output/**/*_final.mp4
          retention-days: 7

      - name: 📤 Upload formats
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-formats-${{ github.run_number }}
          path: |
            output/**/*_1_1.mp4
            output/**/*_16_9.mp4
            output/**/*_4_5.mp4
          retention-days: 7

      - name: 📤 Upload subtitles
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitles-${{ github.run_number }}
          path: output/**/*.srt
          retention-days: 30

      - name: 💾 Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vsg.db
          key: vsg-db-${{ github.ref_name }}-${{ github.run_number }}
