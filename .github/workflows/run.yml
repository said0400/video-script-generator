name: 🎬 Video Script Generator

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "💡 الفكرة (مثال: فوائد الصيام المتقطع)"
        required: true
        type: string
      tone:
        description: "🎭 الأسلوب"
        required: true
        default: "energetic"
        type: choice
        options:
          - energetic
          - inspirational
          - educational
          - humorous
          - calm
      voice:
        description: "🎙️ الصوت"
        required: true
        default: "male_smooth"
        type: choice
        options:
          - male_smooth
          - male_warm
          - female_clear
          - female_warm
          - neutral
      script_only:
        description: "📝 نص فقط بدون صوت أو فيديو؟"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      no_video:
        description: "🎵 صوت فقط بدون فيديو؟"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate:
    name: Generate Script + Audio + Video
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🟢 Setup Node.js 20
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Remotion dependencies
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        working-directory: remotion
        run: npm install

      - name: 🖥️ Install Chrome for Remotion
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: ✅ Verify Chrome
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        run: google-chrome --version

      - name: 🎬 Run generator
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          FLAGS=""

          if [ "${{ inputs.script_only }}" = "true" ]; then
            FLAGS="$FLAGS --script-only"
          fi

          if [ "${{ inputs.no_video }}" = "true" ]; then
            FLAGS="$FLAGS --no-video"
          fi

          python main.py "${{ inputs.idea }}" \
            --tone "${{ inputs.tone }}" \
            --voice "${{ inputs.voice }}" \
            --output output \
            $FLAGS

      - name: 📤 Upload final video
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: output_final.mp4
          retention-days: 7

      - name: 📤 Upload audio (no-video mode)
        if: ${{ inputs.no_video == 'true' && inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-${{ github.run_number }}
          path: output_*.wav
          retention-days: 7
