name: 🎬 Motivational Video Generator

on:
  workflow_dispatch:
    inputs:

      scripts_file:
        description: "📄 Path to scripts file in repo (e.g. scripts/videos.xlsx)"
        required: true
        default: "scripts/videos.xlsx"
        type: string

      video_number:
        description: "🎬 Video number to process (empty = all)"
        required: false
        default: ""
        type: string

      voice_en:
        description: "🎙️ English voice"
        required: true
        default: "male_smooth"
        type: choice
        options:
          - male_smooth
          - male_warm
          - female_clear
          - female_warm
          - neutral

      voice_ar:
        description: "🎙️ Arabic voice"
        required: true
        default: "female_warm"
        type: choice
        options:
          - male_smooth
          - male_warm
          - female_clear
          - female_warm
          - neutral

      tone:
        description: "🎨 Narration tone"
        required: true
        default: "energetic"
        type: choice
        options:
          - energetic
          - inspirational
          - emotional
          - calm

      sfx_type:
        description: "🔊 Transition SFX"
        required: true
        default: "swoosh"
        type: choice
        options:
          - swoosh
          - whoosh

      music_volume:
        description: "🎵 Music volume (0.08=quiet | 0.12=medium | 0.18=loud)"
        required: true
        default: "0.12"
        type: string

      formats:
        description: "📐 Export formats (comma-separated: 1x1,16x9,4x5)"
        required: true
        default: "1x1,16x9"
        type: string

      script_only:
        description: "📝 Script only? (no audio/video)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      no_video:
        description: "🎵 Audio only? (skip video render)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      ab_test:
        description: "🔀 A/B test? (generate verbal_hook variant)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      force:
        description: "⚡ Force re-render? (ignore resume)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate:
    name: 🎬 Generate Videos
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: 🟢 Setup Node.js 20
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Node dependencies
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npm install

      - name: 🔧 Install system dependencies
        if: ${{ inputs.script_only == 'false' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 xvfb \
            fonts-noto fonts-noto-core fonts-hosny-amiri fonts-sil-scheherazade
          sudo fc-cache -fv
          ffmpeg -version | head -1

      - name: 🌐 Install Playwright Chromium (Node)
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npx playwright install chromium

      - name: 📥 Restore SQLite database (resume)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 📥 Restore used videos DB (legacy)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: used-videos-db
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🎬 Run generator
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
        run: |
          FLAGS=""

          [ "${{ inputs.script_only }}" = "true" ] && FLAGS="$FLAGS --script-only"
          [ "${{ inputs.no_video }}"    = "true" ] && FLAGS="$FLAGS --no-video"
          [ "${{ inputs.ab_test }}"     = "true" ] && FLAGS="$FLAGS --ab-test"
          [ "${{ inputs.force }}"       = "true" ] && FLAGS="$FLAGS --force"

          [ -n "${{ inputs.video_number }}" ] && \
            FLAGS="$FLAGS --video-number ${{ inputs.video_number }}"

          python main.py "${{ inputs.scripts_file }}" \
            --voice-en     "${{ inputs.voice_en }}"    \
            --voice-ar     "${{ inputs.voice_ar }}"    \
            --tone         "${{ inputs.tone }}"        \
            --music-volume "${{ inputs.music_volume }}" \
            --sfx-type     "${{ inputs.sfx_type }}"    \
            --formats      "${{ inputs.formats }}"     \
            --output-dir   output                      \
            $FLAGS

      - name: 📤 Upload final videos (9:16)
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-9x16-${{ github.run_number }}
          path: output/**/*_final.mp4
          retention-days: 7

      - name: 📤 Upload additional formats
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-formats-${{ github.run_number }}
          path: |
            output/**/*_1_1.mp4
            output/**/*_16_9.mp4
            output/**/*_4_5.mp4
          retention-days: 7

      - name: 📤 Upload SRT subtitles
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitles-${{ github.run_number }}
          path: output/**/*.srt
          retention-days: 30

      - name: 📤 Upload thumbnails
        if: ${{ inputs.script_only == 'false' && inputs.no_video == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ github.run_number }}
          path: output/**/*_thumbnail.png
          retention-days: 30

      - name: 📤 Upload audio files
        if: ${{ inputs.no_video == 'true' && inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_number }}
          path: output/**/*_audio_mixed.aac
          retention-days: 7

      - name: 📤 Save SQLite database (for resume)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database
          path: vsg.db
          retention-days: 90
          overwrite: true
