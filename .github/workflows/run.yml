name: 🎬 Video Script Generator

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "💡 الفكرة"
        required: true
        type: string
      tone:
        description: "🎭 الأسلوب"
        required: true
        default: "energetic"
        type: choice
        options: [energetic, inspirational, educational, humorous, calm]
      voice:
        description: "🎙️ الصوت"
        required: true
        default: "male_smooth"
        type: choice
        options: [male_smooth, male_warm, female_clear, female_warm, neutral]
      script_only:
        description: "📝 نص فقط؟"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  generate:
    name: Generate Script + Audio + Video
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Remotion dependencies
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npm install

      - name: 🎬 Generate script + audio + video
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ "${{ inputs.script_only }}" = "true" ]; then
            python main.py "${{ inputs.idea }}" \
              --tone "${{ inputs.tone }}" \
              --voice "${{ inputs.voice }}" \
              --output output \
              --script-only
          else
            # الكود أصبح بسيطاً ومباشراً لأن main.py الآن يتكفل بالتنقل والـ Rendering داخلياً
            python main.py "${{ inputs.idea }}" \
              --tone "${{ inputs.tone }}" \
              --voice "${{ inputs.voice }}" \
              --output output
          fi

      - name: 📤 Upload final video
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: output_final.mp4
          retention-days: 7

      - name: 📤 Upload audio only (script-only mode)
        if: ${{ inputs.script_only == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-${{ github.run_number }}
          path: output_*.wav
          retention-days: 7
