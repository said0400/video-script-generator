name: 🎬 Video Script Generator

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "💡 الفكرة أو الموضوع"
        required: true
        type: string

      content_type:
        description: "🎭 نوع المحتوى"
        required: true
        default: "motivational"
        type: choice
        options:
          - motivational
          - true_crime
          - psychological_horror
          - confessions
          - human_drama
          - revenge
          - strange_habits
          - shocking_facts
          - relationship
          - mindset
          - mystery
          - dark_history

      tone:
        description: "🎨 الأسلوب"
        required: true
        default: "energetic"
        type: choice
        options:
          - energetic
          - calm
          - suspenseful
          - emotional
          - educational
          - provocative
          - humorous
          - inspirational

      voice_en:
        description: "🎙️ صوت النسخة الإنجليزية"
        required: true
        default: "male_smooth"
        type: choice
        options:
          - male_smooth
          - male_warm
          - female_clear
          - female_warm
          - neutral

      voice_ar:
        description: "🎙️ صوت النسخة العربية"
        required: true
        default: "female_warm"
        type: choice
        options:
          - male_smooth
          - male_warm
          - female_clear
          - female_warm
          - neutral

      sfx_type:
        description: "🔊 مؤثر الانتقال بين الكليبات"
        required: true
        default: "swoosh"
        type: choice
        options:
          - swoosh
          - whoosh

      music_volume:
        description: "🎵 مستوى صوت الموسيقى (0.08=هادئ | 0.12=متوسط | 0.18=قوي)"
        required: true
        default: "0.12"
        type: string

      script_only:
        description: "📝 نص فقط؟ (بدون فيديو أو صوت)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      no_video:
        description: "🎵 صوت + محتوى فقط؟ (بدون فيديو)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      content_only:
        description: "📦 محتوى فقط؟ (hashtags + captions + thumbnail)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate:
    name: 🎬 Generate Video + Content
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: 🟢 Setup Node.js 20
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Node dependencies
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npm install

      - name: 🔧 Install system dependencies
        if: ${{ inputs.script_only == 'false' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxshmfence1 \
            xvfb \
            fonts-noto \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-sil-scheherazade
          sudo fc-cache -fv
          ffmpeg -version | head -1

      - name: 🌐 Install Playwright Chromium (Node)
        if: ${{ inputs.script_only == 'false' }}
        working-directory: remotion
        run: npx playwright install chromium

      - name: 📥 Download used videos DB
        if: >
          inputs.script_only == 'false' &&
          inputs.content_only == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: used-videos-db
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🎬 Run generator
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
        run: |
          FLAGS=""

          if [ "${{ inputs.script_only }}" = "true" ]; then
            FLAGS="$FLAGS --script-only"
          fi

          if [ "${{ inputs.no_video }}" = "true" ]; then
            FLAGS="$FLAGS --no-video"
          fi

          if [ "${{ inputs.content_only }}" = "true" ]; then
            FLAGS="$FLAGS --content-only"
          fi

          python main.py "${{ inputs.idea }}" \
            --content-type "${{ inputs.content_type }}" \
            --tone         "${{ inputs.tone }}" \
            --voice-en     "${{ inputs.voice_en }}" \
            --voice-ar     "${{ inputs.voice_ar }}" \
            --music-volume "${{ inputs.music_volume }}" \
            --sfx-type     "${{ inputs.sfx_type }}" \
            --output       output \
            $FLAGS

      - name: 📤 Upload English video
        if: >
          inputs.script_only == 'false' &&
          inputs.no_video == 'false' &&
          inputs.content_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: video-EN-${{ github.run_number }}
          path: output_en_final.mp4
          retention-days: 7

      - name: 📤 Upload Arabic video
        if: >
          inputs.script_only == 'false' &&
          inputs.no_video == 'false' &&
          inputs.content_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: video-AR-${{ github.run_number }}
          path: output_ar_final.mp4
          retention-days: 7

      - name: 📤 Upload audio files
        if: >
          inputs.no_video == 'true' &&
          inputs.script_only == 'false' &&
          inputs.content_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_number }}
          path: |
            output_en_audio_mixed.aac
            output_ar_audio_mixed.aac
            output_en_voice_*.wav
            output_ar_voice_*.wav
          retention-days: 7

      - name: 📤 Upload content package
        if: ${{ inputs.script_only == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_number }}
          path: |
            output_content.json
            output_thumbnail.png
            output_thumbnail.html
          retention-days: 30

      - name: 📤 Upload used videos DB
        if: >
          always() &&
          inputs.script_only == 'false' &&
          inputs.content_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: used-videos-db
          path: used_videos.json
          retention-days: 90
          overwrite: true
