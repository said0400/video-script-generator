name: 🇸🇦 Arabic Videos (Short + Long)

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long"]
      video_number:
        description: "🎬 Video number (empty = auto next)"
        required: false
        default: ""
        type: string
      force:
        description: "⚡ Force re-render?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      force_ai:
        description: "🤖 Force re-generate AI?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_fb:
        description: "📘 Publish to Facebook?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_yt:
        description: "📺 Publish to YouTube?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: video-ar
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TORCH_VERSION: "2.5.1"

jobs:
  generate:
    name: 🇸🇦 Generate Arabic Video
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg libsndfile1 xvfb fonts-noto fonts-noto-core fonts-hosny-amiri fonts-sil-scheherazade
          sudo fc-cache -fv

      - name: 💾 Cache stable-ts models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: stable-ts-models-v2-${{ runner.os }}
          restore-keys: stable-ts-models-

      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch==${{ env.TORCH_VERSION }} torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu

      - name: 📦 Install openai-whisper (required by stable-ts)
        run: |
          pip install setuptools wheel
          pip install openai-whisper==20240930 --no-build-isolation

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: ✅ Verify stable-ts installation
        run: python -c "import stable_whisper; print('✅ stable-ts OK')"

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: npm ci

      - name: 🌐 Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: 📥 Restore DB
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-ar
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🇸🇦 Generate + Publish Arabic
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY:       ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID_AR }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN_AR }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID_AR }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_AR }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AR }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          CURRENT_LANG:          "ar"
        run: |
          MODE="short"
          HOUR=$(date -u +"%H")
          [ "$HOUR" = "22" ] && MODE="long"
          [ -n "${{ github.event.inputs.content_mode }}" ] && MODE="${{ github.event.inputs.content_mode }}"

          if [ "$MODE" = "long" ]; then
            INPUT_FILE="scripts/videos_ar_long.xlsx"
            OUTPUT_DIR="output_long"
          else
            INPUT_FILE="scripts/videos_ar.xlsx"
            OUTPUT_DIR="output"
          fi

          FLAGS="--lang ar --content-mode $MODE --auto-next"
          [ "${{ github.event.inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          [ "${{ github.event.inputs.force_ai }}" = "true" ] && FLAGS="$FLAGS --force-ai"
          [ "${{ github.event.inputs.publish_fb }}" = "true" ] && FLAGS="$FLAGS --publish-fb"
          [ "${{ github.event.inputs.publish_yt }}" = "true" ] && FLAGS="$FLAGS --publish-yt"
          [ "${{ github.event.inputs.publish_fb }}" = "false" ] && \
          [ "${{ github.event.inputs.publish_yt }}" = "false" ] && FLAGS="$FLAGS --no-publish"
          [ -n "${{ github.event.inputs.video_number }}" ] && FLAGS="$FLAGS --video-number ${{ github.event.inputs.video_number }}"

          python main.py "$INPUT_FILE" --output-dir "$OUTPUT_DIR" $FLAGS

      - name: 📤 Upload final videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-videos-${{ github.run_number }}
          path: |
            output/**/*_final.mp4
            output_long/**/*_final.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-thumbnails-${{ github.run_number }}
          path: |
            output/**/*_thumbnail.png
            output_long/**/*_thumbnail.png
          retention-days: 30
          if-no-files-found: ignore

      - name: 📤 Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-subtitles-${{ github.run_number }}
          path: |
            output/**/*.srt
            output_long/**/*.srt
          retention-days: 30
          if-no-files-found: ignore

      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database-ar
          path: vsg.db
          retention-days: 90
          overwrite: true
