name: 🇫🇷 French Videos (Short + Long)

on:
  schedule:
    # ══════════════════════════════════════════════════════════
    # التوقيت المحلي: فرنسا/بلجيكا (Europe/Paris)
    #   الصيف  (UTC+2): من آخر أحد في مارس إلى آخر أحد في أكتوبر
    #   الشتاء (UTC+1): من آخر أحد في أكتوبر إلى آخر أحد في مارس
    # GitHub يقرأ الـ cron بتوقيت UTC فقط، لذلك نضع وقت الموسمين معًا،
    # و job "check" يوقف التشغيل الذي لا يطابق الموسم الحالي.
    # ══════════════════════════════════════════════════════════

    # ── 11:30 فرنسا — كل الأيام (Short) ──────────────────────
    - cron: "30 9 * * *"             # صيف  : 09:30 UTC = 11:30 فرنسا
    - cron: "30 10 * * *"            # شتاء : 10:30 UTC = 11:30 فرنسا

    # ── 16:00 فرنسا — كل الأيام (Short) ──────────────────────
    - cron: "0 14 * * *"             # صيف  : 14:00 UTC = 16:00 فرنسا
    - cron: "0 15 * * *"             # شتاء : 15:00 UTC = 16:00 فرنسا

    # ── 21:00 فرنسا — الأحد/الاثنين/الأربعاء/الخميس/السبت (Short) ──
    - cron: "0 19 * * 0,1,3,4,6"     # صيف  : 19:00 UTC = 21:00 فرنسا
    - cron: "0 20 * * 0,1,3,4,6"     # شتاء : 20:00 UTC = 21:00 فرنسا

    # ── 19:00 فرنسا — الثلاثاء والجمعة (Long) ────────────────
    - cron: "0 17 * * 2,5"           # صيف  : 17:00 UTC = 19:00 فرنسا
    - cron: "0 18 * * 2,5"           # شتاء : 18:00 UTC = 19:00 فرنسا

  workflow_dispatch:
    inputs:
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long"]
      video_number:
        description: "🎬 Video number (empty = auto next)"
        required: false
        default: ""
        type: string
      force:
        description: "⚡ Force re-render?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      force_ai:
        description: "🤖 Force re-generate AI?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_fb:
        description: "📘 Publish to Facebook?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_yt:
        description: "📺 Publish to YouTube?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TORCH_VERSION: "2.5.1"
  PLAYWRIGHT_VERSION: "1.50.0"

jobs:
  # ══════════════════════════════════════════════════════════
  # 🕐 فحص التوقيت الصيفي/الشتوي (Europe/Paris)
  # التشغيل اليدوي يمر دائمًا، والتشغيل المجدول يمر فقط إذا
  # طابق الـ cron الموسم الحالي في فرنسا.
  # ══════════════════════════════════════════════════════════
  check:
    name: 🕐 Check Paris time (DST)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.dst.outputs.proceed }}
    steps:
      - name: 🕐 DST guard
        id: dst
        env:
          EVENT_NAME:     ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "▶️ Manual run → proceed"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # الإزاحة الحالية لباريس: +0200 (صيف) أو +0100 (شتاء)
          PARIS_OFFSET=$(TZ=Europe/Paris date +%z)

          # الإزاحة التي صُمم لها الـ cron الذي شغّل الـ workflow
          case "$EVENT_SCHEDULE" in
            "30 9 * * *"|"0 14 * * *"|"0 19 * * 0,1,3,4,6"|"0 17 * * 2,5")
              CRON_OFFSET="+0200" ;;
            "30 10 * * *"|"0 15 * * *"|"0 20 * * 0,1,3,4,6"|"0 18 * * 2,5")
              CRON_OFFSET="+0100" ;;
            *)
              CRON_OFFSET="unknown" ;;
          esac

          echo "🕐 Paris now : $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M %Z (%z)')"
          echo "📅 Cron      : $EVENT_SCHEDULE (designed for $CRON_OFFSET)"

          if [ "$PARIS_OFFSET" = "$CRON_OFFSET" ]; then
            echo "✅ Season matches → proceed"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ Wrong season for this cron → skip"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: 🇫🇷 Generate French Video
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # ✅ concurrency على مستوى الـ job: التشغيلات المتجاوزة (الموسم الخاطئ)
    #    لا تدخل الطابور ولا تلغي التشغيلات الصحيحة المنتظرة
    concurrency:
      group: video-fr
      cancel-in-progress: false

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ffmpeg libsndfile1 libgomp1 xvfb \
            fonts-noto fonts-noto-core \
            fonts-hosny-amiri fonts-sil-scheherazade \
            libglib2.0-0 libgbm1
          sudo fc-cache -fv

      - name: 💾 Cache stable-ts models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stable-ts
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/whisper
          key: stable-ts-models-v2-${{ runner.os }}
          restore-keys: stable-ts-models-

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            remotion/node_modules/playwright/.local-browsers
            remotion/node_modules/playwright-core/.local-browsers
          key: "playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}"
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🔥 Install PyTorch ${{ env.TORCH_VERSION }} (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch==${{ env.TORCH_VERSION }} torchaudio==${{ env.TORCH_VERSION }} \
            --index-url https://download.pytorch.org/whl/cpu

      - name: 📦 Install openai-whisper (required by stable-ts)
        run: |
          pip install "setuptools<81.0.0" wheel
          pip install openai-whisper==20240930 --no-build-isolation
          pip install --upgrade setuptools

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: ✅ Verify stable-ts installation
        run: python -c "import stable_whisper; print('✅ stable-ts OK')"

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Node dependencies
        working-directory: remotion
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: 🌐 Install Playwright Chromium (Python + Node.js)
        run: |
          echo "🐍 Installing for Python Playwright..."
          python -m playwright install chromium --with-deps
          echo "✅ Python Playwright: OK"

          echo ""
          echo "🟢 Installing for Node.js Playwright..."
          cd remotion
          npx playwright install chromium --with-deps
          cd ..
          echo "✅ Node.js Playwright: OK"

      - name: 📥 Restore DB
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-fr
          if_no_artifact_found: ignore
          search_artifacts: true
          branch: ${{ github.ref_name }}

      - name: 🇫🇷 Generate + Publish French
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1:         ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2:         ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3:         ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4:         ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY5:         ${{ secrets.GROQ_API_KEY5 }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1:       ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2:       ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3:       ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4:       ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5:       ${{ secrets.GEMINI_API_KEY5 }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_1:      ${{ secrets.PEXELS_API_KEY_1 }}
          PEXELS_API_KEY_2:      ${{ secrets.PEXELS_API_KEY_2 }}
          PIXABAY_API_KEY:       ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEY_1:     ${{ secrets.PIXABAY_API_KEY_1 }}
          PIXABAY_API_KEY_2:     ${{ secrets.PIXABAY_API_KEY_2 }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID_FR }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN_FR }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID_FR }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_FR }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FR }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          CURRENT_LANG:          "fr"
          INPUT_CONTENT_MODE:    ${{ github.event.inputs.content_mode }}
          INPUT_VIDEO_NUMBER:    ${{ github.event.inputs.video_number }}
          INPUT_FORCE:           ${{ github.event.inputs.force }}
          INPUT_FORCE_AI:        ${{ github.event.inputs.force_ai }}
          INPUT_PUBLISH_FB:      ${{ github.event.inputs.publish_fb }}
          INPUT_PUBLISH_YT:      ${{ github.event.inputs.publish_yt }}
          # نص الـ cron الذي شغّل الـ workflow (فارغ في التشغيل اليدوي)
          EVENT_SCHEDULE:        ${{ github.event.schedule }}

        run: |
          # ── تحديد MODE ──────────────────────────────────────
          # الثلاثاء والجمعة 19:00 فرنسا (17:00 UTC صيفًا / 18:00 UTC شتاءً)
          # = فيديو طويل، الباقي Shorts
          MODE="short"
          case "$EVENT_SCHEDULE" in
            "0 17 * * 2,5"|"0 18 * * 2,5") MODE="long" ;;
          esac
          [ -n "$INPUT_CONTENT_MODE" ] && MODE="$INPUT_CONTENT_MODE"

          FORCE="${INPUT_FORCE:-false}"
          FORCE_AI="${INPUT_FORCE_AI:-false}"
          PUBLISH_FB="${INPUT_PUBLISH_FB:-true}"
          PUBLISH_YT="${INPUT_PUBLISH_YT:-true}"
          VIDEO_NUMBER="${INPUT_VIDEO_NUMBER:-}"

          if [ "$MODE" = "long" ]; then
            INPUT_FILE="scripts/fr_long.xlsx"
            OUTPUT_DIR="output_long"
          else
            INPUT_FILE="scripts/fr_short.xlsx"
            OUTPUT_DIR="output"
          fi

          FLAGS=(--lang fr --content-mode "$MODE" --auto-next --platform both)
          
          [ "$FORCE" = "true" ]      && FLAGS+=(--force)
          [ "$FORCE_AI" = "true" ]   && FLAGS+=(--force-ai)
          [ "$PUBLISH_FB" = "true" ] && FLAGS+=(--publish-fb)
          [ "$PUBLISH_YT" = "true" ] && FLAGS+=(--publish-yt)
          [ "$PUBLISH_FB" = "false" ] && [ "$PUBLISH_YT" = "false" ] && FLAGS+=(--no-publish)
          [ -n "$VIDEO_NUMBER" ]     && FLAGS+=(--video-number "$VIDEO_NUMBER")

          python main.py "$INPUT_FILE" --output-dir "$OUTPUT_DIR" "${FLAGS[@]}"

      - name: 📤 Upload final videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-videos-${{ github.run_number }}
          path: |
            output/**/*_final.mp4
            output_long/**/*_final.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-thumbnails-${{ github.run_number }}
          path: |
            output/**/*_thumbnail.png
            output_long/**/*_thumbnail.png
          retention-days: 30
          if-no-files-found: ignore

      - name: 📤 Upload subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-subtitles-${{ github.run_number }}
          path: |
            output/**/*.srt
            output_long/**/*.srt
          retention-days: 30
          if-no-files-found: ignore

      - name: 💾 Save Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database-fr
          path: vsg.db
          retention-days: 90
          overwrite: true
