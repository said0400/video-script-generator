name: 🇸🇦 Arabic Videos (Short + Long)

on:
  schedule:
    # ── 5 Short videos ─────────────────────────
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"

    # ── 1 Long video ──────────────────────────
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      content_mode:
        description: "نوع المحتوى"
        required: true
        default: "short"
        type: choice
        options: ["short", "long"]

      video_number:
        description: "🎬 Video number (empty = auto next)"
        required: false
        default: ""
        type: string

      force:
        description: "⚡ Force re-render?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      force_ai:
        description: "🤖 Force re-generate AI?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

      publish_fb:
        description: "📘 Publish to Facebook?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      publish_yt:
        description: "📺 Publish to YouTube?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: video-ar
  cancel-in-progress: false

jobs:
  generate_ar:
    name: 🇸🇦 Arabic Video
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 🔧 Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg libsndfile1 xvfb
          sudo fc-cache -fv

      - name: 💾 Cache WhisperX models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisperx
            ~/.cache/huggingface
            ~/.cache/torch
          key: whisperx-models-v7

      - name: 🔥 Install PyTorch (CPU)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch==2.1.2 torchaudio==2.1.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: 📦 Install Python deps
        run: pip install -r requirements.txt

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Node deps
        working-directory: remotion
        run: npm ci

      - name: 🌐 Install Playwright
        run: python -m playwright install chromium

      - name: 📥 Restore DB
        uses: dawidd6/action-download-artifact@v6
        with:
          name: vsg-database-ar
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 🇸🇦 Generate + Publish Arabic
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY:   ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN:          ${{ secrets.HF_TOKEN }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID_AR }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN_AR }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID_AR }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_AR }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AR }}
        run: |

          # تحديد mode تلقائيًا حسب التوقيت
          MODE="short"
          HOUR=$(date -u +"%H")

          if [ "$HOUR" = "22" ]; then
            MODE="long"
          fi

          # إذا تشغيل يدوي
          if [ -n "${{ github.event.inputs.content_mode }}" ]; then
            MODE="${{ github.event.inputs.content_mode }}"
          fi

          if [ "$MODE" = "long" ]; then
            INPUT_FILE="scripts/videos_ar_long.xlsx"
            OUTPUT_DIR="output_long"
          else
            INPUT_FILE="scripts/videos_ar.xlsx"
            OUTPUT_DIR="output"
          fi

          FLAGS="--lang ar --content-mode $MODE --auto-next"

          [ "${{ github.event.inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          [ "${{ github.event.inputs.force_ai }}" = "true" ] && FLAGS="$FLAGS --force-ai"
          [ "${{ github.event.inputs.publish_fb }}" = "true" ] && FLAGS="$FLAGS --publish-fb"
          [ "${{ github.event.inputs.publish_yt }}" = "true" ] && FLAGS="$FLAGS --publish-yt"
          [ "${{ github.event.inputs.publish_fb }}" = "false" ] && \
          [ "${{ github.event.inputs.publish_yt }}" = "false" ] && FLAGS="$FLAGS --no-publish"

          if [ -n "${{ github.event.inputs.video_number }}" ]; then
            FLAGS="$FLAGS --video-number ${{ github.event.inputs.video_number }}"
          fi

          python main.py "$INPUT_FILE" \
            --output-dir "$OUTPUT_DIR" \
            $FLAGS

      - name: 📤 Upload final videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-videos-${{ github.run_number }}
          path: |
            output/**/*_final.mp4
            output_long/**/*_final.mp4
          retention-days: 7

      - name: 📤 Save DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg-database-ar
          path: vsg.db
          retention-days: 90
          overwrite: true
